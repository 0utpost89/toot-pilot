    ctx.beginPath(); ctx.arc(cx - 10, cy + 2, 11, 0, TAU); ctx.arc(cx + 8, cy, 13, 0, TAU); ctx.arc(cx, cy - 8, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(cx - 4, cy - 2, 1.8, 0, TAU); ctx.arc(cx + 5, cy - 2, 1.8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy + 3, 4, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function drawClock(cx, cy) {
  if (cx > W + 40 || cx < -40) return;
  ctx.fillStyle = '#8a5a3b'; ctx.beginPath(); ctx.arc(cx, cy, 25, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fbf3e0'; ctx.beginPath(); ctx.arc(cx, cy, 20, 0, TAU); ctx.fill();
  ctx.fillStyle = '#5a4a3a';
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * TAU;
    ctx.fillRect(cx + Math.cos(a) * 16 - 1, cy + Math.sin(a) * 16 - 1, 2, 2);
  }
  ctx.strokeStyle = '#2c2244'; ctx.lineCap = 'round';
  const hand = (a, len, lw) => { ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(a) * len, cy - Math.cos(a) * len); ctx.stroke(); };
  hand(game.time * 0.08 + 2.7, 9, 3);  // 3am-ish, and racing
  hand(game.time * 0.9, 14, 2);
  ctx.lineCap = 'butt';
}

function drawNightstand(x, floorY) {
  if (x > W + 20 || x + 80 < -20) return;
  ctx.fillStyle = '#8a5a3b'; ctx.fillRect(x, floorY - 56, 72, 50);
  ctx.fillRect(x + 4, floorY - 6, 6, 6); ctx.fillRect(x + 62, floorY - 6, 6, 6);
  ctx.fillStyle = '#a8714a'; ctx.fillRect(x - 3, floorY - 60, 78, 6);
  ctx.strokeStyle = '#5e3b25'; ctx.lineWidth = 2; ctx.strokeRect(x + 8, floorY - 46, 56, 16);
  ctx.fillStyle = '#e8c06a'; ctx.beginPath(); ctx.arc(x + 36, floorY - 38, 3, 0, TAU); ctx.fill();
  // glass of water & alarm clock
  ctx.fillStyle = 'rgba(180,220,255,0.6)'; ctx.fillRect(x + 10, floorY - 76, 10, 16);
  ctx.fillStyle = '#e05d5d'; roundRect(ctx, x + 36, floorY - 78, 26, 18, 5); ctx.fill();
  ctx.fillStyle = '#7dff9b'; ctx.font = `bold 8px monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('3:07', x + 49, floorY - 69);
}

function drawRadiator(x, floorY) {
  if (x > W + 20 || x + 110 < -20) return;
  ctx.fillStyle = '#9aa0b5'; roundRect(ctx, x, floorY - 62, 104, 50, 5); ctx.fill();
  ctx.fillStyle = '#7e849a';
  for (let k = 0; k < 8; k++) ctx.fillRect(x + 7 + k * 12, floorY - 58, 5, 42);
  ctx.fillRect(x + 10, floorY - 12, 6, 12); ctx.fillRect(x + 88, floorY - 12, 6, 12);
  // a sock drying on top
  ctx.fillStyle = '#ffb3c7'; roundRect(ctx, x + 50, floorY - 66, 26, 8, 4); ctx.fill();
  roundRect(ctx, x + 68, floorY - 66, 8, 22, 4); ctx.fill();
}

function drawPlant(x, floorY, seed) {
  if (x > W + 40 || x + 70 < -40) return;
  const cx = x + 25;
  ctx.fillStyle = '#4fa35a';
  for (let k = 0; k < 6; k++) {
    const a = -Math.PI / 2 + (k - 2.5) * 0.35 + Math.sin(game.time * 1.5 + k + seed) * 0.03;
    ctx.save(); ctx.translate(cx, floorY - 40); ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(28, 0, 28, 8, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#d27a4a';
  ctx.beginPath(); ctx.moveTo(cx - 20, floorY - 42); ctx.lineTo(cx + 20, floorY - 42); ctx.lineTo(cx + 15, floorY); ctx.lineTo(cx - 15, floorY); ctx.fill();
  ctx.fillStyle = '#e6955f'; ctx.fillRect(cx - 22, floorY - 46, 44, 7);
}

function drawTeddy(cx, floorY) {
  if (cx > W + 40 || cx < -40) return;
  const y = floorY - 24;
  ctx.fillStyle = '#b07a4f';
  ctx.beginPath(); ctx.ellipse(cx, y + 6, 18, 18, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - 12, y + 20, 7, 0, TAU); ctx.arc(cx + 12, y + 20, 7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, y - 18, 13, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - 10, y - 29, 5, 0, TAU); ctx.arc(cx + 10, y - 29, 5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e3c29b'; ctx.beginPath(); ctx.ellipse(cx, y - 13, 6, 4.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(cx - 5, y - 20, 1.6, 0, TAU); ctx.arc(cx + 5, y - 20, 1.6, 0, TAU); ctx.arc(cx, y - 15, 2, 0, TAU); ctx.fill();
}

/* ---------------------------------------------------------------------
   11. RENDER: OBSTACLES & PICKUPS
   --------------------------------------------------------------------- */
function drawObstacles(cam) {
  for (const o of game.obstacles) {
    const sx = o.x - cam;
    if (sx < -200 || sx > W + 200) continue;
    if (o.top.type === 'fan') drawFan(o, sx); else drawLamp(o, sx);
    drawPile(o, sx);
  }
}

function drawFan(o, sx) {
  const top = CONFIG.ceilingY, by = o.gapTop - 9, R = o.top.bladeR;
  // canopy & downrod
  ctx.fillStyle = '#d8d2e6'; roundRect(ctx, sx - 14, top - 4, 28, 10, 4); ctx.fill();
  ctx.fillStyle = '#b9b2c8'; ctx.fillRect(sx - 3, top + 4, 6, Math.max(0, by - 18 - top - 4));
  // motion blur disc
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.ellipse(sx, by, R, R * 0.15, 0, 0, TAU); ctx.fill();
  // blades, back ones first
  const blades = [];
  for (let k = 0; k < 4; k++) blades.push(o.top.angle + k * Math.PI / 2);
  blades.sort((a, b) => Math.sin(a) - Math.sin(b));
  const drawBlade = a => {
    const c = Math.cos(a), s = Math.sin(a);
    const P = (u, v) => [sx + (c * u - s * v), by + (s * u + c * v) * 0.15];
    const pts = [P(12, 5), P(R, 11), P(R, -11), P(12, -5)];
    ctx.fillStyle = s > 0 ? '#c08850' : '#9c6a3c';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5e3b25'; ctx.lineWidth = 1.2; ctx.stroke();
  };
  blades.filter(a => Math.sin(a) <= 0).forEach(drawBlade);
  // motor housing + light bowl
  ctx.fillStyle = '#efeaf7'; roundRect(ctx, sx - 18, by - 20, 36, 18, 8); ctx.fill();
  ctx.strokeStyle = '#8f87a8'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#c9a8ff'; ctx.fillRect(sx - 18, by - 12, 36, 3);
  blades.filter(a => Math.sin(a) > 0).forEach(drawBlade);
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.ellipse(sx, by + 1, 10, 5.5, 0, 0, Math.PI); ctx.fill();
}

function drawLamp(o, sx) {
  const top = CONFIG.ceilingY, L = o.top.len, th = lampAngle(o);
  ctx.fillStyle = '#d8d2e6'; ctx.beginPath(); ctx.arc(sx, top, 9, Math.PI, 0); ctx.fill();
  ctx.save();
  ctx.translate(sx, top);
  ctx.rotate(-th);
  // soft light cone
  const g = ctx.createLinearGradient(0, L + LAMP_SHADE_H, 0, L + LAMP_SHADE_H + 200);
  g.addColorStop(0, 'rgba(255,230,140,0.22)'); g.addColorStop(1, 'rgba(255,230,140,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-30, L + LAMP_SHADE_H); ctx.lineTo(30, L + LAMP_SHADE_H); ctx.lineTo(90, L + LAMP_SHADE_H + 200); ctx.lineTo(-90, L + LAMP_SHADE_H + 200); ctx.fill();
  // cord
  ctx.strokeStyle = '#1e1630'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, L); ctx.stroke();
  ctx.fillStyle = '#bfb6d6'; ctx.fillRect(-5, L - 5, 10, 7);
  // bulb
  ctx.fillStyle = 'rgba(255,240,170,0.5)'; ctx.beginPath(); ctx.arc(0, L + LAMP_SHADE_H - 4, 14, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff6c4'; ctx.beginPath(); ctx.arc(0, L + LAMP_SHADE_H - 4, 8, 0, TAU); ctx.fill();
  // shade (trapezoid with scalloped trim)
  ctx.fillStyle = o.top.color;
  ctx.beginPath();
  ctx.moveTo(-13, L); ctx.lineTo(13, L); ctx.lineTo(31, L + LAMP_SHADE_H - 6); ctx.lineTo(-31, L + LAMP_SHADE_H - 6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(40,20,60,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.moveTo(-8, L + 2); ctx.lineTo(-3, L + 2); ctx.lineTo(-12, L + LAMP_SHADE_H - 8); ctx.lineTo(-20, L + LAMP_SHADE_H - 8); ctx.fill();
  ctx.fillStyle = '#fff3e0';
  for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(-26 + k * 10.4, L + LAMP_SHADE_H - 6, 5, 0, Math.PI); ctx.fill(); }
  ctx.restore();
}

function drawPile(o, sx) {
  o.pile.items.forEach((it, i) => {
    const wob = Math.sin(game.time * 2 + i * 1.3) * 0.8;
    ctx.save();
    ctx.translate(sx + it.off + wob, it.y + it.h / 2);
    ctx.rotate(it.side * Math.PI / 2 + it.tilt);
    drawBag(it);
    ctx.restore();
  });
}

// Outline of an upright mini backpack: domed top, flat base with soft corners.
function bagPath(bw, top, bot, inset = 0) {
  const hw = bw / 2 - inset, t = top + inset, b = bot - inset;
  const dh = Math.min(hw * 0.95, (b - t) * 0.45), rc = 7;
  ctx.beginPath();
  ctx.moveTo(-hw, t + dh);
  ctx.ellipse(0, t + dh, hw, dh, 0, Math.PI, TAU);
  ctx.lineTo(hw, b - rc); ctx.quadraticCurveTo(hw, b, hw - rc, b);
  ctx.lineTo(-hw + rc, b); ctx.quadraticCurveTo(-hw, b, -hw, b - rc);
  ctx.closePath();
}

// Draws one mini backpack upright and centred on the origin (the caller lays it on its side).
// Its width is the stack item's height and its length is the item's width.
function drawBag(it) {
  const bw = it.h, L = it.w, top = -L / 2 + 9, bot = L / 2;
  const [body, trim] = it.pal;
  const outline = 'rgba(20,10,30,0.7)';
  const rnd = k => hash2(it.seed, k);

  // carry handle loop
  ctx.strokeStyle = trim; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(0, top + 2, 7, 8, 0, Math.PI, TAU); ctx.stroke();

  // ears at the shoulders of the dome
  ctx.fillStyle = body; ctx.strokeStyle = outline; ctx.lineWidth = 1.5;
  const ex = bw * 0.27, ey = top + Math.min(bw * 0.2, 10);
  if (it.ears === 'cat') {
    for (const sg of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sg * ex - 8, ey + 3); ctx.lineTo(sg * (ex + 4), ey - 12); ctx.lineTo(sg * ex + 8, ey + 3);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  } else if (it.ears === 'bear') {
    for (const sg of [-1, 1]) { ctx.beginPath(); ctx.arc(sg * (ex + 2), ey - 3, 7, 0, TAU); ctx.fill(); ctx.stroke(); }
  }

  // body with zip piping round the edge
  ctx.fillStyle = body; bagPath(bw, top, bot); ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = trim; ctx.lineWidth = 2; bagPath(bw, top, bot, 3); ctx.stroke();

  // front pocket: rounded top, sits on the base, zip along its top
  const pw = bw * 0.78, ph = (bot - top) * 0.42, pt = bot - ph - 3;
  ctx.fillStyle = body;
  roundRect(ctx, -pw / 2, pt, pw, ph, 10); ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = trim; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-pw / 2 + 3, pt + 10); ctx.arcTo(-pw / 2 + 3, pt + 3, -pw / 2 + 12, pt + 3, 8);
  ctx.arcTo(pw / 2 - 3, pt + 3, pw / 2 - 3, pt + 12, 8); ctx.lineTo(pw / 2 - 3, pt + 10); ctx.stroke();
  // little badge patch
  ctx.fillStyle = '#d9d4e2'; roundRect(ctx, pw / 2 - 13, bot - 15, 9, 11, 1.5); ctx.fill();
  ctx.strokeStyle = 'rgba(20,10,30,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();

  // embroidered motifs on the upper body and the pocket
  const spots = [[-0.22, 0.42], [0.2, 0.3], [0.05, 0.55], [-0.25, 0.8], [0.12, 0.83]];
  spots.forEach(([fx, fy], k) => {
    const x = fx * bw + (rnd(k) - 0.5) * 4, y = top + fy * (bot - top);
    drawMotif(it.motif, x, y, 3 + rnd(k + 9) * 1.5, trim, k);
  });
}

function drawMotif(motif, x, y, r, trim, k) {
  if (motif === 'flowers') {
    ctx.fillStyle = ['#c49bff', '#ffb3c7', '#ffd98a', '#f4f1ea'][k % 4];
    for (let a = 0; a < 5; a++) { ctx.beginPath(); ctx.arc(x + Math.cos(a * 1.257) * r * 0.8, y + Math.sin(a * 1.257) * r * 0.8, r * 0.55, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x, y, r * 0.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#7cc68a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + r, y + r * 0.6); ctx.quadraticCurveTo(x + r * 2, y, x + r * 2.4, y + r * 1.2); ctx.stroke();
  } else if (motif === 'bats') {
    ctx.fillStyle = trim;
    ctx.beginPath(); ctx.moveTo(x, y + r * 0.4);
    ctx.quadraticCurveTo(x - r, y - r * 0.6, x - r * 2.2, y - r * 0.2); ctx.quadraticCurveTo(x - r * 1.4, y + r * 0.1, x - r * 1.2, y + r * 0.7);
    ctx.quadraticCurveTo(x - r * 0.6, y + r * 0.3, x, y + r * 0.9);
    ctx.quadraticCurveTo(x + r * 0.6, y + r * 0.3, x + r * 1.2, y + r * 0.7); ctx.quadraticCurveTo(x + r * 1.4, y + r * 0.1, x + r * 2.2, y - r * 0.2);
    ctx.quadraticCurveTo(x + r, y - r * 0.6, x, y + r * 0.4);
    ctx.fill();
  } else if (motif === 'stars') {
    ctx.fillStyle = k % 2 ? '#ffd166' : trim; drawSparkle(x, y, r * 1.3);
  } else {
    ctx.fillStyle = k % 2 ? '#ff8fab' : trim; drawHeart(x, y, r);
  }
}

function drawSparkle(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.3, y - r * 0.3); ctx.lineTo(x + r, y); ctx.lineTo(x + r * 0.3, y + r * 0.3);
  ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.3, y + r * 0.3); ctx.lineTo(x - r, y); ctx.lineTo(x - r * 0.3, y - r * 0.3);
  ctx.closePath(); ctx.fill();
}

function drawHeart(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y + r);
  ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.4);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r);
  ctx.fill();
}

function drawStarShape(x, y, r) {
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

function drawBeanCan(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const w = 22, h = 28;
  ctx.fillStyle = '#c9d1db'; roundRect(ctx, -w / 2, -h / 2, w, h, 3); ctx.fill();
  ctx.fillStyle = '#ff7b22'; ctx.fillRect(-w / 2, -h / 2 + 4, w, h - 8);
  ctx.fillStyle = '#2e64c8'; ctx.fillRect(-w / 2, -3, w, 7);
  ctx.fillStyle = '#fff'; ctx.font = `bold 6px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('BEANS', 0, 0.5);
  ctx.fillStyle = '#b5532a';
  ctx.beginPath(); ctx.ellipse(-4, -7, 2.5, 1.6, 0.3, 0, TAU); ctx.ellipse(2, -8, 2.5, 1.6, -0.2, 0, TAU); ctx.ellipse(-1, 8, 2.5, 1.6, 0.1, 0, TAU); ctx.ellipse(5, 7, 2.5, 1.6, 0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#eef2f6'; ctx.beginPath(); ctx.ellipse(0, -h / 2, w / 2, 3.5, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8c96a3'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-w / 2 + 3, -h / 2 + 4, 3, h - 8);
  ctx.restore();
}

function drawBeans(cam) {
  for (const b of game.beans) {
    if (b.taken) continue;
    const sx = b.x - cam;
    if (sx < -40 || sx > W + 40) continue;
    const pulse = 0.5 + 0.5 * Math.sin(game.time * 6 + b.phase);
    ctx.fillStyle = `rgba(255,220,120,${0.18 + 0.15 * pulse})`;
    ctx.beginPath(); ctx.arc(sx, b.y, 24 + pulse * 4, 0, TAU); ctx.fill();
    drawBeanCan(sx, b.y, 1, Math.sin(game.time * 2.5 + b.phase) * 0.2);
  }
}

/* ---------------------------------------------------------------------
   12. RENDER: PLAYER & PARTICLES
   --------------------------------------------------------------------- */
const PJ = '#ff8fc8', PJ_DARK = '#e46aa9', PJ_OUT = '#a93f78';
const SKIN = '#ffd9bd', SKIN_OUT = '#c98e6e', HAIR = '#7b3a2c';

function drawShadow(y) {
  const floorY = H - CONFIG.floorHeight;
  const d = clamp((floorY - y) / 400, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.3 * (1 - d)})`;
  ctx.beginPath(); ctx.ellipse(player.x, floorY + 18, 22 * (1 - d * 0.6), 5, 0, 0, TAU); ctx.fill();
}

function drawPlayer(y) {
  const p = player, t = game.time, ex = p.expression;
  const sy = 1 + p.stretch, sx = 1 - p.stretch * 0.6;
  ctx.save();
  ctx.translate(p.x, y);
  ctx.rotate(p.angle);
  ctx.scale(sx, sy);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // --- legs with bunny slippers (back leg first) ---
  const legSpeed = p.thrusting ? 22 : ex === 'panic' ? 26 : 9;
  for (const side of [1, 0]) {
    const kick = Math.sin(t * legSpeed + side * Math.PI) * (ex === 'panic' ? 5 : 3);
    const hipX = -2 - side * 2, hipY = 10;
    const fx = -13 + kick * 0.6 - side * 3, fy = 22 + kick * 0.5;
    ctx.strokeStyle = side ? PJ_DARK : PJ; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(fx, fy); ctx.stroke();
    drawSlipper(fx - 2, fy + 3, side);
  }

  // --- jetpack ---
  ctx.fillStyle = '#ef5a6f'; roundRect(ctx, -21, -10, 11, 23, 4); ctx.fill();
  ctx.strokeStyle = '#7a2a3a'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-19, -7, 2.5, 17);
  ctx.fillStyle = '#d7dde6'; roundRect(ctx, -20, -13, 9, 4, 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-15.5, -1, 3, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  const needle = -2.4 + (p.tank / CONFIG.tankMax) * 2.4;
  ctx.beginPath(); ctx.moveTo(-15.5, -1); ctx.lineTo(-15.5 + Math.cos(needle) * 2.5, -1 + Math.sin(needle) * 2.5); ctx.stroke();
  ctx.fillStyle = '#a9b3c1';
  ctx.beginPath(); ctx.moveTo(-19, 13); ctx.lineTo(-12, 13); ctx.lineTo(-11, 19); ctx.lineTo(-20, 19); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#5a6270'; ctx.stroke();

  // --- back arm ---
  const sh = { x: 1, y: -4 };
  let backHand = { x: 6, y: 7 };
  if (ex === 'panic') { const a = -2.4 + Math.sin(t * 30 + 1) * 0.6; backHand = { x: sh.x + Math.cos(a) * 12, y: sh.y + Math.sin(a) * 12 }; }
  if (ex === 'dead') { const a = t * 9; backHand = { x: sh.x + Math.cos(a) * 11, y: sh.y + Math.sin(a) * 11 }; }
  ctx.strokeStyle = PJ_DARK; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(backHand.x, backHand.y); ctx.stroke();
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(backHand.x, backHand.y, 2.8, 0, TAU); ctx.fill();

  // --- torso: polka-dot pyjamas ---
  ctx.fillStyle = PJ;
  ctx.beginPath(); ctx.ellipse(0, 3, 10.5, 12.5, 0, 0, TAU); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  [[-5, -2], [3, -5], [5, 6], [-3, 9], [-7, 6], [8, 0], [0, 2], [-2, -8]].forEach(([dx, dy]) => {
    ctx.beginPath(); ctx.arc(dx, dy, 1.6, 0, TAU); ctx.fill();
  });
  ctx.restore();
  ctx.strokeStyle = PJ_OUT; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 3, 10.5, 12.5, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#8fd3ff';    // collar
  ctx.beginPath(); ctx.moveTo(-1, -8); ctx.lineTo(4, -4); ctx.lineTo(8, -8); ctx.lineTo(4, -10); ctx.fill();
  ctx.strokeStyle = '#5b3a66'; ctx.lineWidth = 2.5;  // jetpack straps
  ctx.beginPath(); ctx.moveTo(-9, -6); ctx.quadraticCurveTo(0, -12, 3, -3); ctx.moveTo(-10, 8); ctx.lineTo(9, 7); ctx.stroke();

  // --- head ---
  ctx.save();
  ctx.translate(4, -15);
  ctx.rotate(ex === 'panic' ? Math.sin(t * 40) * 0.06 : 0);
  drawHead(ex, t);
  ctx.restore();

  // --- front arm ---
  let hand;
  switch (ex) {
    case 'determined': hand = { x: 15, y: -7 }; break;                       // superhero fist
    case 'panic': { const a = -1.9 + Math.sin(t * 28) * 0.7; hand = { x: sh.x + 2 + Math.cos(a) * 12, y: sh.y + Math.sin(a) * 12 }; break; }
    case 'smug': hand = { x: 12, y: -3 }; break;                             // thumbs up
    case 'dead': { const a = t * 8 + 2; hand = { x: sh.x + 2 + Math.cos(a) * 11, y: sh.y + Math.sin(a) * 11 }; break; }
    default: hand = { x: 11, y: 3 };
  }
  ctx.strokeStyle = PJ; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(sh.x + 2, sh.y); ctx.lineTo(hand.x, hand.y); ctx.stroke();
  ctx.fillStyle = SKIN; ctx.strokeStyle = SKIN_OUT; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(hand.x, hand.y, 3, 0, TAU); ctx.fill(); ctx.stroke();
  if (ex === 'smug') { roundRect(ctx, hand.x - 1, hand.y - 7, 2.6, 5, 1.3); ctx.fill(); ctx.stroke(); }

  ctx.restore();
}

function drawSlipper(x, y, side) {
  ctx.fillStyle = side ? '#f2dbe6' : '#fff4f8';
  ctx.strokeStyle = '#d9a3bf'; ctx.lineWidth = 1;
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.35);
  ctx.beginPath(); ctx.ellipse(-3, -6, 2, 5, -0.4, 0, TAU); ctx.ellipse(1, -6, 2, 5, 0.2, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = side ? '#f2dbe6' : '#fff4f8';
  ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 4.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff8fab'; ctx.beginPath(); ctx.arc(6.5, -0.5, 1.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(3.5, -1.8, 0.9, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawHead(ex, t) {
  const p = player;
  // hair (back) and messy bun with scrunchie
  ctx.fillStyle = HAIR;
  ctx.beginPath(); ctx.ellipse(-3, -1, 12.5, 12, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-9, -11, 6.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd84d'; ctx.beginPath(); ctx.ellipse(-6.5, -7.5, 3.5, 2, 0.7, 0, TAU); ctx.fill();
  // face
  ctx.fillStyle = SKIN; ctx.strokeStyle = SKIN_OUT; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-4, 2, 2.6, 0, TAU); ctx.fill();
  // fringe
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(-10, -2);
  ctx.quadraticCurveTo(-7, -14, 4, -12);
  ctx.quadraticCurveTo(11, -10, 11.5, -3);
  ctx.quadraticCurveTo(7, -7, 3, -6);
  ctx.quadraticCurveTo(-2, -8, -6, -3);
  ctx.closePath(); ctx.fill();
  // blush
  ctx.fillStyle = ex === 'smug' ? 'rgba(255,110,140,0.55)' : 'rgba(255,130,150,0.35)';
  ctx.beginPath(); ctx.arc(1.5, 4, 2.2, 0, TAU); ctx.arc(10, 4, 2, 0, TAU); ctx.fill();

  ctx.fillStyle = '#2a1a2e'; ctx.strokeStyle = '#2a1a2e'; ctx.lineWidth = 1.4;
  const eyes = [[3.5, -1], [9, -1]];
  switch (ex) {
    case 'determined':
      eyes.forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 1.5, 1.5, 0, 0, TAU); ctx.fill(); });
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(1, -5.2); ctx.lineTo(5, -3.4); ctx.moveTo(7.5, -3.4); ctx.lineTo(11, -5.2); ctx.stroke();
      ctx.fillStyle = '#fff'; roundRect(ctx, 3, 3.5, 7, 3, 1); ctx.fill();
      ctx.lineWidth = 0.8; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, 5); ctx.lineTo(10, 5); ctx.stroke();
      break;
    case 'panic':
      ctx.fillStyle = '#fff';
      eyes.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y - 0.5, 2.7, 0, TAU); ctx.fill(); ctx.lineWidth = 0.8; ctx.stroke(); });
      ctx.fillStyle = '#2a1a2e';
      eyes.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x + Math.sin(t * 50) * 0.5, y - 0.5, 0.9, 0, TAU); ctx.fill(); });
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(3.5, -4.5, 2.5, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(9, -4.5, 2.5, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
      ctx.fillStyle = '#5a1e2a'; ctx.beginPath(); ctx.ellipse(6.5, 5.5, 2.2, 3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7ec8f2';                       // sweat drop
      ctx.beginPath(); ctx.moveTo(12, -9); ctx.quadraticCurveTo(15, -4, 12.5, -3.5); ctx.quadraticCurveTo(10, -4, 12, -9); ctx.fill();
      break;
    case 'smug':
      eyes.forEach(([x, y]) => {
        ctx.beginPath(); ctx.ellipse(x, y, 1.7, 1.8, 0, 0, Math.PI); ctx.fill();
        ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 2.2, y); ctx.lineTo(x + 2.2, y); ctx.stroke();
      });
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(1.5, -4); ctx.lineTo(5, -4); ctx.moveTo(7.5, -5.5); ctx.quadraticCurveTo(9.5, -7, 11, -5.5); ctx.stroke();
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(3.5, 4.5); ctx.quadraticCurveTo(7.5, 6.5, 10.5, 2.8); ctx.stroke();
      break;
    case 'dead':
      ctx.lineWidth = 1.3;
      eyes.forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x - 1.8, y - 1.8); ctx.lineTo(x + 1.8, y + 1.8); ctx.moveTo(x + 1.8, y - 1.8); ctx.lineTo(x - 1.8, y + 1.8); ctx.stroke(); });
      ctx.beginPath(); ctx.moveTo(3, 5); ctx.quadraticCurveTo(5, 3.5, 6.5, 5); ctx.quadraticCurveTo(8, 6.5, 10, 5); ctx.stroke();
      ctx.fillStyle = '#ff7b9c'; ctx.beginPath(); ctx.ellipse(8, 6.8, 1.8, 2.4, 0, 0, TAU); ctx.fill();
      // dizzy stars orbiting
      for (let k = 0; k < 3; k++) {
        const a = t * 6 + k * TAU / 3;
        drawStar(Math.cos(a) * 15, -12 + Math.sin(a) * 4, 3, a, '#ffe066');
      }
      break;
    default:
      if (p.blinkT < 0) {
        ctx.lineWidth = 1.2;
        eyes.forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x - 1.6, y); ctx.lineTo(x + 1.6, y); ctx.stroke(); });
      } else {
        eyes.forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 1.4, 1.9, 0, 0, TAU); ctx.fill(); });
        ctx.fillStyle = '#fff';
        eyes.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x + 0.5, y - 0.7, 0.5, 0, TAU); ctx.fill(); });
      }
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(6.5, 3.5, 2.8, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
}

function drawStar(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// layer 'back' = gas clouds (behind the player), 'front' = everything else
function drawParticles(cam, layer) {
  for (const q of game.particles) {
    const isGas = q.type === 'gas';
    if ((layer === 'back') !== isGas) continue;
    const t = q.life / q.max;
    const x = q.screen ? q.x : q.x - cam, y = q.y;
    if (x < -80 || x > W + 80) continue;
    if (isGas) {
      const r = q.r0 + (q.r1 - q.r0) * (1 - (1 - t) * (1 - t));
      const a = (1 - t) * 0.6;
      ctx.globalAlpha = a;
      ctx.fillStyle = q.c1; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.globalAlpha = a * 0.7;
      ctx.fillStyle = q.c2; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.45, 0, TAU); ctx.fill();
    } else if (q.type === 'star') {
      ctx.globalAlpha = 1 - t;
      drawStar(x, y, q.r0, q.rot, q.color);
    } else if (q.type === 'spark') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(x, y, q.r0 * (1 - t * 0.5), 0, TAU); ctx.fill();
    } else if (q.type === 'text') {
      ctx.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
      const pop = t < 0.15 ? easeOutBack(t / 0.15) : 1;
      ctx.save(); ctx.translate(x, y); ctx.rotate(q.rot); ctx.scale(pop, pop);
      drawText(q.text, 0, 0, q.size, q.color);
      if (q.sub) drawText(q.sub, 0, q.size * 1.1, q.size * 0.75, '#fff');
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------------
   13. RENDER: UI
   --------------------------------------------------------------------- */
function drawText(str, x, y, size, color = '#fff', align = 'center', stroke = true) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = Math.max(2, size * 0.18); ctx.strokeStyle = '#2b1740'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fitSize(str, size, maxW) {
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width;
  return w > maxW ? Math.floor(size * maxW / w) : size;
}
function wrapLines(str, size, maxW) {
  ctx.font = `bold ${size}px ${FONT}`;
  const words = str.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawMuteButton() {
  const { x, y, r } = MUTE_BTN;
  ctx.fillStyle = 'rgba(43,23,64,0.75)'; ctx.beginPath(); ctx.arc(x, y, r - 4, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(x - 8, y - 3); ctx.lineTo(x - 4, y - 3); ctx.lineTo(x + 1, y - 8); ctx.lineTo(x + 1, y + 8); ctx.lineTo(x - 4, y + 3); ctx.lineTo(x - 8, y + 3); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  if (Sound.muted) {
    ctx.strokeStyle = '#ff6b6b';
    ctx.beginPath(); ctx.moveTo(x + 4, y - 4); ctx.lineTo(x + 10, y + 4); ctx.moveTo(x + 10, y - 4); ctx.lineTo(x + 4, y + 4); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 2, y, 5, -0.8, 0.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 2, y, 9, -0.8, 0.8); ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawGasMeter() {
  const p = player, C = CONFIG;
  const x = 14, y = H - 40, w = Math.min(150, W * 0.4), h = 18;
  const frac = p.tank / C.tankMax, low = frac < 0.25;
  drawText('GAS', x, y - 18, 14, '#d8ff7a', 'left');
  ctx.fillStyle = 'rgba(43,23,64,0.85)'; roundRect(ctx, x - 3, y - 3, w + 6, h + 6, 9); ctx.fill();
  if (frac > 0) {
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#6fd34a'); g.addColorStop(1, '#d8ff7a');
    ctx.fillStyle = low ? (Math.sin(game.time * 20) > 0 ? '#ff5d5d' : '#ffb35d') : g;
    roundRect(ctx, x, y, Math.max(h, w * frac), h, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; roundRect(ctx, x + 3, y + 2, Math.max(h, w * frac) - 6, 4, 2); ctx.fill();
  }
  if (p.thrusting) {                            // bubbles while draining
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let k = 0; k < 3; k++) {
      const bx = x + ((game.time * 60 + k * 37) % Math.max(10, w * frac));
      ctx.beginPath(); ctx.arc(bx, y + h / 2 + Math.sin(game.time * 10 + k) * 3, 2, 0, TAU); ctx.fill();
    }
  }
  if (frac <= 0.001 && input.held) drawText('EMPTY!', x + w / 2, y + h / 2, 12, '#fff');
}

function drawHUD() {
  const s = 46 * (1 + game.scorePulse * 0.25);
  drawText(String(game.score), W / 2, 82, s, '#fff');
  if (game.state === 'play' || game.state === 'dying') drawGasMeter();
}

function drawTitle() {
  const title = 'TOOT PILOT';
  const size = fitSize(title, 64, W - 40);
  ctx.font = `bold ${size}px ${FONT}`;
  const total = ctx.measureText(title).width;
  let x = W / 2 - total / 2;
  for (let i = 0; i < title.length; i++) {
    const ch = title[i], cw = ctx.measureText(ch).width;
    const bob = Math.sin(game.time * 4 + i * 0.6) * 5;
    drawText(ch, x + cw / 2, 140 + bob, size, i % 2 ? '#d8ff7a' : '#9be564');
    x += cw;
  }
  drawText('A gas-powered pyjama adventure', W / 2, 140 + size * 0.75, fitSize('A gas-powered pyjama adventure', 18, W - 30), '#ffd1e8');

  const lines = [
    ['TAP / CLICK / SPACE to toot upward', '#fff'],
    ['HOLD for a turbo toot (uses gas)', '#fff'],
    ['Grab the beans to refill your tank!', '#ffb347'],
  ];
  const ls = Math.min(18, ...lines.map(([l]) => fitSize(l, 18, W - 30)));
  lines.forEach(([l, c], i) => drawText(l, W / 2, 400 + i * (ls + 10), ls, c));
  if (Math.sin(game.time * 5) > -0.3) drawText('Tap to start!', W / 2, 505, 26, '#ffe066');
  if (game.best > 0) drawText(`Best: ${game.best}  ·  ${RANKS[rankIndex(game.best)][1]}`, W / 2, 545, fitSize(`Best: ${game.best}  ·  ${RANKS[rankIndex(game.best)][1]}`, 16, W - 30), '#cfc2ea');
}

function drawGameOver() {
  const t = Math.min(1, game.overT / 0.35), e = easeOutBack(t);
  ctx.fillStyle = `rgba(20,8,35,${0.55 * t})`;
  ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 24, 400), ph = 380;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(e, e);
  // panel
  ctx.fillStyle = '#fff6e8'; roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 22); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#2b1740'; ctx.stroke();
  ctx.save(); roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 22); ctx.clip();
  ctx.fillStyle = '#9be564'; ctx.fillRect(-pw / 2, -ph / 2, pw, 62);
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-pw / 2, -ph / 2 + 62); ctx.lineTo(pw / 2, -ph / 2 + 62); ctx.stroke();
  drawText('GAME OVER', 0, -ph / 2 + 32, fitSize('GAME OVER', 36, pw - 40), '#fff');

  // quip
  const ms = 17, lines = wrapLines(game.message, ms, pw - 40);
  const shown = lines.slice(0, 3), my = -ph / 2 + 104 - (shown.length - 1) * 11;
  shown.forEach((l, i) => drawText(l, 0, my + i * 22, ms, '#6a3f8a', 'center', false));

  // scores
  const col = pw / 4;
  drawText('SCORE', -col, -10, 15, '#8a6aa0', 'center', false);
  drawText('BEST', col, -10, 15, '#8a6aa0', 'center', false);
  drawText(String(game.score), -col, 24, 40, '#ffe066');
  drawText(String(game.best), col, 24, 40, '#9be564');
  if (game.newBest) {
    ctx.save(); ctx.translate(col + 38, -16); ctx.rotate(0.25 + Math.sin(game.time * 6) * 0.08);
    drawStar(0, 0, 26, 0, '#ff6b9c');
    drawText('NEW!', 0, 1, 12, '#fff', 'center', false);
    ctx.restore();
  }

  // rank
  const ri = rankIndex(game.score), rank = RANKS[ri][1];
  drawText('Rank', 0, 66, 15, '#8a6aa0', 'center', false);
  drawText(rank, 0, 94, fitSize(rank, 28, pw - 30), '#ff8fc8');
  const next = RANKS[ri + 1];
  const nextStr = next ? `Next: ${next[1]} at ${next[0]}` : 'Maximum stinkiness achieved!';
  drawText(nextStr, 0, 124, fitSize(nextStr, 14, pw - 30), '#8a6aa0', 'center', false);

  if (game.overT > 0.6 && Math.sin(game.time * 5) > -0.3) drawText('Tap to try again', 0, ph / 2 - 30, 22, '#fff');
  ctx.restore();
}

function render(alpha) {
  const camR = lerp(game.prevCam, game.cam, alpha);
  const pyR = lerp(player.prevY, player.y, alpha);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.fillStyle = '#1a1430'; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-1, 1) * game.shake, rand(-1, 1) * game.shake);
  drawBackground(camR);
  drawShadow(pyR);
  drawObstacles(camR);
  drawBeans(camR);
  drawParticles(camR, 'back');
  drawPlayer(pyR);
  drawParticles(camR, 'front');
  ctx.restore();

  if (game.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${game.flash * 0.6})`; ctx.fillRect(0, 0, W, H); }

  if (game.state === 'title') drawTitle();
  else drawHUD();
  if (game.state === 'over') drawGameOver();
  drawMuteButton();
}

/* ---------------------------------------------------------------------
   14. MAIN LOOP — fixed timestep simulation, interpolated rendering
   --------------------------------------------------------------------- */
let lastTime = performance.now(), accumulator = 0;

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = clamp(dt, 0, CONFIG.maxFrameTime);
  accumulator += dt;
  let steps = 0;
  while (accumulator >= CONFIG.fixedStep && steps < 60) {
    step(CONFIG.fixedStep);
    accumulator -= CONFIG.fixedStep;
    steps++;
  }
  render(accumulator / CONFIG.fixedStep);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
buildWallpaper();
canvas.focus();
requestAnimationFrame(frame);

// Handy for debugging / tweaking from the console.
window.TootPilot = { game, player, CONFIG, Sound };
</script>
</body>
