<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1430">
<meta name="apple-mobile-web-app-title" content="Toot Pilot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Toot Pilot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #1a1430;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; outline: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Toot Pilot game"></canvas>
<script>
'use strict';

/* =====================================================================
   TOOT PILOT
   A cute pyjama-clad pilot flies through her house on a gas-powered
   jetpack. Everything is drawn with canvas shapes and every sound is
   synthesised with the Web Audio API. No external assets.

   Sections:
     1. Config            8. Input
     2. Utilities         9. Update (fixed timestep)
     3. Canvas & scaling 10. Render: background
     4. Audio            11. Render: obstacles & pickups
     5. Text data        12. Render: player & particles
     6. Game state       13. Render: UI
     7. World & particles 14. Main loop
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. CONFIG — tweak the feel of the game here
   --------------------------------------------------------------------- */
const CONFIG = {
  // View: the game is drawn in a logical space of fixed height; width
  // adapts to the screen's aspect ratio within these limits.
  viewHeight: 640,
  minViewWidth: 300,
  maxViewWidth: 1200,
  ceilingY: 40,            // bottom edge of the ceiling (px)
  floorHeight: 72,         // height of the floor band (px)

  // Physics (px, seconds)
  gravity: 1550,           // downward acceleration
  flapImpulse: -440,       // vertical velocity set on each tap
  holdThrust: 2500,        // upward acceleration while holding
  holdDelay: 0.14,         // hold this long before sustained thrust kicks in
  maxRiseSpeed: -500,
  maxFallSpeed: 720,

  // Scrolling & difficulty
  scrollSpeed: 175,        // starting scroll speed
  scrollSpeedPerPoint: 2.5,
  maxScrollSpeed: 290,
  obstacleSpacing: 300,    // horizontal distance between obstacles
  gapSize: 215,            // starting gap height
  gapShrinkPerPoint: 2.2,
  minGapSize: 150,
  gapRandomness: 18,
  maxGapShiftStart: 120,   // how far the gap can jump between obstacles...
  maxGapShiftPerPoint: 5,  // ...growing with score...
  maxGapShift: 280,        // ...up to this
  lampSwingStart: 0.15,    // radians
  lampSwingPerPoint: 0.012,
  lampSwingMax: 0.42,

  // Toot Coins (saved between games and spent in the shop)
  coinRowChance: 0.4,      // chance of a little arc of coins through a gap
  noteChance: 0.12,        // chance of a banknote between obstacles
  noteValue: 5,
  stackChance: 0.03,       // chance of a risky bundle of notes near a gap's edge
  stackValue: 25,

  // Fizz boost: a bottle of something sparkling
  fizzChance: 0.08,        // chance of a bottle between obstacles...
  fizzStartAfter: 4,       // ...once she's passed this many
  fizzDuration: 6,         // seconds of double points
  fizzWobble: 420,         // how tipsy the flight gets

  // Chocolate bar shield: absorbs one crash
  chocChance: 0.07,        // chance of a chocolate bar between obstacles...
  chocStartAfter: 3,       // ...once she's passed this many
  shieldGrace: 1.3,        // seconds of safety after the shield snaps

  // Sound
  fartStyle: 'slap',       // 'rasp' (raspberry buzz), 'flutter' (brrrrp) or 'slap' (wet pbbbt)

  // Player
  playerX: 0.28,           // fraction of view width (capped at 260px)
  playerRadius: 15,        // collision radius

  // Loop
  fixedStep: 1 / 120,      // simulation step (seconds)
  maxFrameTime: 0.25,      // clamp for long frames (tab switches etc.)
};

/* ---------------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

// Deterministic pseudo-random number in [0,1) for procedural scenery.
function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
const hash2 = (n, k) => hash(n * 17.31 + k * 101.73);

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixColor(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function roundRect(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Circle vs axis-aligned rectangle overlap.
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

// localStorage can throw (private mode, blocked storage) so wrap it.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ } },
};

function parseList(str) {
  try { const a = JSON.parse(str); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}

// Toot Coins and shop purchases, kept in localStorage alongside the high score.
const wallet = {
  coins: parseInt(store.get('tootPilot.coins', '0'), 10) || 0,
  owned: new Set(parseList(store.get('tootPilot.owned', '[]'))),
  pj: store.get('tootPilot.pj', 'pj-pink'),
  add(n) { this.coins += n; this.save(); },
  save() {
    store.set('tootPilot.coins', this.coins);
    store.set('tootPilot.owned', JSON.stringify([...this.owned]));
    store.set('tootPilot.pj', this.pj);
  },
};

/* ---------------------------------------------------------------------
   3. CANVAS & SCALING
   --------------------------------------------------------------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 480, H = CONFIG.viewHeight;   // logical view size
let wallPattern = null;

function resize() {
  const vw = document.body.clientWidth || window.innerWidth, vh = document.body.clientHeight || window.innerHeight;
  H = CONFIG.viewHeight;
  W = Math.round(clamp(H * vw / vh, CONFIG.minViewWidth, CONFIG.maxViewWidth));
  const scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  player.x = Math.min(W * CONFIG.playerX, 260);
}

// Wallpaper tile rendered once to an offscreen canvas and used as a pattern.
function buildWallpaper() {
  const S = 2; // tile drawn at 2x for crispness
  const t = document.createElement('canvas');
  t.width = 56 * S; t.height = 80 * S;
  const g = t.getContext('2d');
  g.scale(S, S);
  g.fillStyle = '#463a72'; g.fillRect(0, 0, 56, 80);
  g.fillStyle = '#4f4282'; g.fillRect(28, 0, 28, 80);
  g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(27, 0, 2, 80);
  const flower = (x, y, c) => {
    g.fillStyle = c;
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * TAU;
      g.beginPath(); g.arc(x + Math.cos(a) * 3, y + Math.sin(a) * 3, 2, 0, TAU); g.fill();
    }
    g.fillStyle = 'rgba(246,211,107,0.7)';
    g.beginPath(); g.arc(x, y, 1.5, 0, TAU); g.fill();
  };
  flower(14, 22, 'rgba(255,190,220,0.4)');
  flower(42, 62, 'rgba(190,220,255,0.4)');
  g.fillStyle = 'rgba(255,255,255,0.12)';
  g.beginPath(); g.arc(14, 62, 1.2, 0, TAU); g.arc(42, 22, 1.2, 0, TAU); g.fill();
  wallPattern = ctx.createPattern(t, 'repeat');
  if (wallPattern.setTransform && window.DOMMatrix) wallPattern.setTransform(new DOMMatrix().scale(1 / S));
}

/* ---------------------------------------------------------------------
   4. AUDIO — everything synthesised with Web Audio
   --------------------------------------------------------------------- */
// Pitch, wetness and brightness ranges for each toot style ([min, max]).
const FART_STYLES = {
  rasp:    { f0: [80, 150],  hold: [95, 125],  wet: [0.15, 0.35], cutoff: [2200, 3200] },
  flutter: { f0: [150, 240], hold: [170, 210], wet: [0.1, 0.25],  cutoff: [2400, 3200] },
  slap:    { f0: [32, 60],   hold: [38, 50],   wet: [0.45, 0.75], cutoff: [1800, 2400] },
};

const Sound = {
  ctx: null, master: null, noiseBuf: null, hold: null,
  muted: store.get('tootPilot.muted', '0') === '1',

  // Must be called from a user gesture (browsers block autoplay).
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.55;
      // Compressor keeps overlapping toots from clipping.
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 6;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      setTimeout(() => this.makeHoldBufs(), 300);   // pre-render so the first held toot doesn't stutter
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  on() { return !!this.ctx && !this.muted; },

  setMuted(m) {
    this.muted = m;
    store.set('tootPilot.muted', m ? '1' : '0');
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ctx.currentTime, 0.02);
    if (m) this.stopHold();
  },

  // The star of the show. Each toot is built sample by sample as a train of
  // irregular "flaps", like a raspberry blown with the lips: a puff of
  // pressure that opens, a sharp slap as it closes, a tiny cheek buzz and a
  // breath of air. The gaps between flaps jitter, stall and sputter. Every
  // parameter is randomised so no two toots are alike.
  synthFart(o) {
    const sr = this.ctx.sampleRate, dur = o.dur, loop = !!o.loop;
    const tailLen = loop ? 0 : 0.5;
    const N = Math.ceil((dur + tailLen) * sr);
    const buf = new Float32Array(N);
    const style = o.style, wet = o.wet, buzzF = rand(900, 1500), rough = o.rough ?? rand(0.1, 0.4);
    let ph = 0, wander = 1, wanderTarget = 1, last = 0, count = 0;

    const flap = (t, a, T) => {
      const i0 = Math.round(t * sr);
      let L, shape;
      if (style === 'slap') {                 // slow, wet slaps: pbbbbt
        const fr = rand(110, 190);
        L = Math.round(Math.min(T, 0.03) * sr);
        shape = tt => -0.9 * Math.exp(-tt / 0.0004) + 0.8 * Math.exp(-tt / 0.004) * Math.sin(TAU * fr * tt) +
          wet * (Math.random() * 2 - 1) * Math.exp(-tt / 0.006);
      } else {                                // lip-buzz flap
        const open = T * rand(0.35, 0.5);
        L = Math.round(T * 1.2 * sr);
        shape = tt => (tt < open ? Math.pow(Math.sin(Math.PI * tt / open), 0.6) : -0.9 * Math.exp(-(tt - open) / 0.0005)) +
          0.25 * Math.exp(-tt / 0.0008) * Math.sin(TAU * buzzF * tt) +
          wet * (Math.random() * 2 - 1) * Math.exp(-tt / (T * 0.3));
      }
      for (let k = 0; k < L; k++) {
        let idx = i0 + k;
        if (idx >= N) { if (!loop) break; idx -= N; }
        buf[idx] += a * shape(k / sr);
      }
    };

    // the main burst
    let t = rand(0, 0.004);
    while (t < dur) {
      const p = t / dur;
      if (t > ph) { ph = t + rand(0.03, 0.09); wanderTarget = rand(0.82, 1.2); }
      wander += (wanderTarget - wander) * 0.15;
      const f = o.f0 * Math.pow(o.endRatio, p) * wander;
      const jit = o.jitter * (1 + (o.jitterGrow || 0) * p);
      const T = (1 / f) * (1 + jit * (Math.random() * 2 - 1));
      let env = loop ? 1 : Math.min(1, t / 0.02) * (p < 0.6 ? 1 - p * 0.25 : 0.85 * (1 - (p - 0.6) / 0.4) + 0.12);
      env *= (1 + o.shimmer * (Math.random() * 2 - 1)) * (count++ % 2 ? 1 - rough : 1);   // uneven pairs = growl
      if (style === 'flutter') {              // the buzz comes in rapid bursts: brrrrp
        const g = Math.sin(TAU * o.flutterRate * t);
        if (g < -0.2) { t += T; continue; }
        env *= Math.pow((g + 0.2) / 1.2, 0.5);
      }
      if (Math.random() < o.sputter) { t += T * rand(1.5, 3.5); continue; }   // a little stall
      flap(t, env, T);
      last = t;
      t += T;
    }
    // trailing pops as it runs out of steam
    if (!loop) {
      let pt = last, pops = o.pops ?? randInt(0, 2), a = 0.4;
      for (let k = 0; k < pops; k++) {
        pt += rand(0.035, 0.09) * (1 + k * 0.4);
        if (pt > dur + tailLen - 0.03) break;
        flap(pt, a, 1 / (o.f0 * o.endRatio * rand(0.7, 1)));
        a *= rand(0.5, 0.8);
      }
    }

    // soften with a one-pole low-pass (two passes so a looped buffer has no seam), then block DC
    const al = 1 - Math.exp(-TAU * o.cutoff / sr);
    let y = 0;
    for (let pass = loop ? 0 : 1; pass < 2; pass++)
      for (let i = 0; i < N; i++) { y += al * (buf[i] - y); if (pass === 1) buf[i] = y; }
    let x1 = 0, y1 = 0, peak = 0;
    for (let i = 0; i < N; i++) { const yy = buf[i] - x1 + 0.995 * y1; x1 = buf[i]; buf[i] = y1 = yy; peak = Math.max(peak, Math.abs(yy)); }

    const out = this.ctx.createBuffer(1, N, sr);
    const d = out.getChannelData(0), g = 0.9 / (peak || 1);
    for (let i = 0; i < N; i++) d[i] = buf[i] * g;
    return out;
  },

  fart(o = {}) {
    if (!this.on()) return;
    const c = this.ctx, power = o.power ?? 1, style = o.style || CONFIG.fartStyle, st = FART_STYLES[style];
    const t = c.currentTime + (o.delay || 0);
    const squeaky = !o.noSqueak && Math.random() < 0.12, fz = o.fizzy ? 1.4 : 1;
    const dur = o.dur ?? rand(0.12, 0.3) * (0.7 + 0.6 * Math.min(power, 1.5));
    const f0 = (squeaky ? rand(260, 420) : rand(...st.f0) * (o.f0Mul || 1)) * fz;
    const vol = (o.vol ?? 1) * (0.4 + 0.25 * Math.min(power, 1.5));
    const buffer = this.synthFart({
      dur, f0, style: squeaky ? 'rasp' : style, flutterRate: rand(18, 30),
      endRatio: o.endRatio ?? (Math.random() < 0.7 ? rand(0.55, 0.85) : rand(1.1, 1.4)),
      jitter: o.jitter ?? (squeaky ? rand(0.03, 0.07) : rand(0.06, 0.14)),
      jitterGrow: o.jitterGrow,
      shimmer: rand(0.15, 0.35),
      wet: squeaky ? rand(0.1, 0.2) : rand(...st.wet),
      sputter: o.sputter ?? (squeaky ? 0.01 : rand(0, 0.07)),
      cutoff: squeaky ? 3200 : rand(...st.cutoff),
      pops: o.pops,
    });
    const src = c.createBufferSource(); src.buffer = buffer;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(this.master);
    src.start(t);
    if (o.fizzy) this.bubbles(dur + 0.2, o.delay || 0);

    // Occasionally a little encore.
    if (!o.delay && !o.noDouble && Math.random() < 0.15) {
      this.fart({ power: power * 0.6, delay: dur + rand(0.03, 0.1), noDouble: true });
    }
  },

  makeHoldBufs() {
    if (this.holdBufs && this.holdStyle === CONFIG.fartStyle) return;
    const style = this.holdStyle = CONFIG.fartStyle, st = FART_STYLES[style];
    this.holdBufs = [0, 1, 2].map(() => this.synthFart({
      dur: 2.5, loop: true, style, f0: rand(...st.hold), flutterRate: rand(18, 26), endRatio: 1,
      jitter: rand(0.07, 0.12), shimmer: 0.3, wet: rand(...st.wet), sputter: 0.03, cutoff: rand(...st.cutoff),
    }));
  },

  // Sustained toot while the button is held: a looping flap train whose
  // speed wanders so it stays lively.
  startHold() {
    if (!this.on() || this.hold) return;
    const c = this.ctx, t = c.currentTime;
    this.makeHoldBufs();
    const src = c.createBufferSource(); src.buffer = pick(this.holdBufs); src.loop = true;
    const env = c.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.32, t + 0.04);
    src.connect(env); env.connect(this.master);
    src.start(t, rand(0, 2));
    this.hold = { src, env, next: 0 };
  },
  updateHold(intensity, fizzy) {
    const h = this.hold;
    if (!h) return;
    const t = this.ctx.currentTime;
    if (t > h.next) {
      h.next = t + rand(0.08, 0.2);
      h.src.playbackRate.setTargetAtTime(rand(0.85, 1.2) * (1 + intensity * 0.2) * (fizzy ? 1.3 : 1), t, 0.05);
    }
  },
  stopHold() {
    const h = this.hold;
    if (!h) return;
    const t = this.ctx.currentTime, g = h.env.gain;
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t);
    else { g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); }
    g.setTargetAtTime(0, t, 0.03);
    h.src.stop(t + 0.25);
    this.hold = null;
  },

  tone(freq, dur, type = 'sine', vol = 0.2, delay = 0, slideTo = 0) {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, freq, vol, delay = 0, type = 'bandpass', q = 1) {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const n = c.createBufferSource(); n.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(this.master);
    n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
  },

  blip()    { this.tone(700, 0.08, 'triangle', 0.14); this.tone(1050, 0.1, 'triangle', 0.12, 0.06); },
  click()   { this.tone(600, 0.06, 'square', 0.08); },
  rankUp()  { Music.fanfare(); },
  crash() {
    this.tone(440, 0.32, 'sine', 0.45, 0, 70);          // cartoon "bonk"
    this.tone(880, 0.12, 'square', 0.08, 0, 300);
    this.noise(0.18, 1200, 0.5, 0, 'lowpass');
  },
  coin()    { this.tone(1568, 0.07, 'square', 0.05); this.tone(2093, 0.16, 'square', 0.05, 0.06); },
  cash() {
    this.noise(0.05, 5000, 0.12, 0, 'highpass');                     // ka-
    [1319, 1568, 2093, 2637].forEach((f, i) => this.tone(f, 0.12, 'square', 0.05, 0.05 + i * 0.05));   // -ching!
  },
  bubbles(dur, delay = 0) {
    for (let i = 0; i < 6; i++) this.tone(rand(700, 1400), 0.05, 'sine', 0.05, delay + rand(0, dur), rand(1700, 2600));
  },
  cork() {
    this.noise(0.04, 1800, 0.6, 0, 'bandpass', 2);                   // pop!
    this.tone(320, 0.09, 'sine', 0.25, 0, 900);
    this.noise(0.7, 6000, 0.1, 0.05, 'highpass');                     // fizzzz
    this.bubbles(0.8, 0.05);
  },
  choc()    { this.noise(0.12, 7000, 0.12, 0, 'highpass'); this.tone(523, 0.1, 'triangle', 0.12, 0.04); this.tone(784, 0.18, 'triangle', 0.12, 0.12); },
  snap() {
    this.noise(0.06, 3000, 0.6, 0, 'bandpass', 1.5);
    this.noise(0.05, 1400, 0.4, 0.05, 'bandpass', 2);
    this.tone(200, 0.16, 'square', 0.1, 0, 90);
  },
  fizzOut() { this.tone(900, 0.25, 'sine', 0.08, 0, 300); },
  firework() {

/* ---------------------------------------------------------------------
   4b. MUSIC — an original, bouncy mariachi-brass tune, synthesised live
   --------------------------------------------------------------------- */
// The tune is written in eighth-note steps (8 per bar). Each bar is a chord
// name plus melody notes as [step, length in steps, MIDI note]; '' = honk.
const CHORDS = {
  F: [53, 57, 60], F7: [53, 57, 63], Bb: [58, 62, 65], Bbm: [58, 61, 65], C7: [48, 52, 58],
  Dm: [50, 53, 57], Gm: [55, 58, 62],
};
const SONG = (() => {
  const A = [
    ['F',  [[0, 1, 72], [1, 1, 69], [2, 1, 72], [3, 2, 77], [5, 1, 76], [6, 1, 74], [7, 1, 72]]],
    ['F',  [[0, 2, 69], [3, 1, 69], [4, 1, 70], [5, 2, 72]]],
    ['C7', [[0, 1, 70], [1, 1, 67], [2, 1, 70], [3, 2, 76], [5, 1, 74], [6, 1, 72], [7, 1, 70]]],
    ['C7', [[0, 3, 67], [4, 1, 64], [5, 1, 67], [6, 1, 70], [7, 1, 72]]],
  ];
  const A1 = A.concat([
    ['C7', [[0, 1, 74], [1, 1, 72], [2, 1, 70], [3, 1, 67], [4, 2, 76], [6, 1, 74], [7, 1, 72]]],
    ['C7', [[0, 2, 70], [2, 2, 67], [4, 4, 72]]],
    ['F',  [[0, 1, 69], [1, 1, 72], [2, 1, 77], [3, 2, 81], [5, 1, 79], [6, 1, 77], [7, 1, 76]]],
    ['F',  [[0, 3, 77], [5, 1, ''], [6, 1, '']]],                     // beep-beep!
  ]);
  const A2 = A.concat([
    ['Bb',  [[0, 1, 74], [1, 1, 77], [2, 2, 82], [4, 1, 81], [5, 1, 79], [6, 1, 77], [7, 1, 74]]],
    ['Bbm', [[0, 2, 73], [2, 2, 77], [4, 1, 73], [5, 1, 72], [6, 2, 70]]],
    ['C7',  [[0, 1, 72], [1, 1, 76], [2, 1, 79], [3, 2, 82], [5, 1, 81], [6, 1, 79], [7, 1, 76]]],
    ['F',   [[0, 4, 77]]],
  ]);
  const B = [
    ['Dm', [[0, 2, 81], [2, 2, 77], [4, 2, 74], [6, 1, 76], [7, 1, 77]]],
    ['Dm', [[0, 3, 76], [3, 1, 74], [4, 4, 69]]],
    ['Gm', [[0, 2, 82], [2, 2, 79], [4, 2, 74], [6, 1, 76], [7, 1, 77]]],
    ['Gm', [[0, 3, 79], [3, 1, 77], [4, 4, 74]]],
    ['C7', [[0, 1, 76], [1, 1, 79], [2, 2, 84], [4, 1, 82], [5, 1, 81], [6, 1, 79], [7, 1, 76]]],
    ['C7', [[0, 1, 77], [1, 1, 76], [2, 1, 74], [3, 1, 72], [4, 2, 70], [6, 2, 67]]],
    ['F',  [[0, 1, 69], [1, 1, 72], [2, 2, 77], [4, 4, 81]]],
    ['C7', [[0, 2, 79], [3, 1, ''], [4, 1, '']]],                     // beep-beep!
  ];
  return [].concat(A1, A2, B, A2);
})();

const Music = {
  on: store.get('tootPilot.music', '1') === '1',
  playing: false, gain: null, timer: null, step: 0, nextTime: 0,
  volume: 0.2,               // keeps the music under the toots

  setup() {
    const c = Sound.ctx;
    if (!c || this.gain) return !!c;
    this.gain = c.createGain();
    this.gain.gain.value = this.on ? this.volume : 0;
    this.gain.connect(Sound.master);
    return true;
  },
  start() {                                   // (re)start the tune from the top
    if (!this.setup()) return;
    this.stop();
    this.playing = true;
    this.step = 0;
    this.nextTime = Sound.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop() {
    this.playing = false;
    clearInterval(this.timer);
  },
  toggle() {
    this.on = !this.on;
    store.set('tootPilot.music', this.on ? '1' : '0');
    if (this.gain) this.gain.gain.setTargetAtTime(this.on ? this.volume : 0, Sound.ctx.currentTime, 0.05);
  },
  bpm() { return 152 + (game.state === 'play' ? Math.min(game.score, 40) * 0.4 : 0); },   // a little faster as she scores
  tick() {
    if (!this.playing) return;
    const c = Sound.ctx;
    if (document.hidden) { this.nextTime = c.currentTime + 0.05; return; }
    while (this.nextTime < c.currentTime + 0.15) {
      this.playStep(this.step, this.nextTime, 60 / this.bpm() / 2);
      this.nextTime += 60 / this.bpm() / 2;
      this.step = (this.step + 1) % (SONG.length * 8);
    }
  },

  // Everything that happens on one eighth-note step.
  playStep(step, t, e) {
    const [chord, notes] = SONG[Math.floor(step / 8)], k = step % 8, ch = CHORDS[chord];
    // drums: kick on the beat, snare on the backbeat, hats on every eighth
    if (k % 4 === 0) this.kick(t);
    if (k % 4 === 2) this.snare(t);
    this.hat(t, k === 7);
    // oompah tuba on beats 1 and 3, plucky chord stabs on the offbeats
    if (k === 0) this.tuba(t, ch[0] - 12, e * 1.6);
    if (k === 4) this.tuba(t, ch[2] - 24 + (ch[2] - 24 < ch[0] - 12 ? 12 : 0), e * 1.6);
    if (k === 2 || k === 6) this.stab(t, ch.map(n => n + 12), e * 0.8);
    // the trumpets: melody plus a harmony a chord tone or so below
    for (const [st, len, n] of notes) {
      if (st !== k) continue;
      if (n === '') { this.honk(t); continue; }
      this.trumpet(t, n, len * e * 0.92, 0.2);
      this.trumpet(t, this.harmony(n, ch), len * e * 0.92, 0.13);
    }
  },
  harmony(n, ch) {
    let best = n - 4;
    for (let o = -24; o <= 24; o += 12) for (const c of ch) {
      const h = c + o;
      if (h <= n - 3 && h > best - 1 && h >= n - 9) best = h;
    }
    return best;
  },

  // --- instruments ---
  trumpet(t, midi, d, vol, out = this.gain, wah = false) {
    const c = Sound.ctx, f = 440 * Math.pow(2, (midi - 69) / 12);
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    o1.type = o2.type = 'sawtooth';
    o1.frequency.setValueAtTime(f * 0.97, t); o1.frequency.exponentialRampToValueAtTime(f, t + 0.035);   // brassy scoop
    o2.frequency.setValueAtTime(f * 0.974, t); o2.frequency.exponentialRampToValueAtTime(f * 1.004, t + 0.035);
    const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = 2;
    filt.frequency.setValueAtTime(f * 1.5, t);
    filt.frequency.exponentialRampToValueAtTime(Math.min(f * 8, 5500), t + 0.04);
    filt.frequency.exponentialRampToValueAtTime(Math.min(f * 4.5, 4000), t + 0.18);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.018);
    g.gain.setValueAtTime(vol * 0.8, t + Math.max(0.03, d - 0.04));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.05);
    if (d > 0.3 || wah) {                      // vibrato on held notes
      const lfo = c.createOscillator(), ld = c.createGain();
      lfo.frequency.value = wah ? 4.5 : 5.5;
      ld.gain.setValueAtTime(0, t); ld.gain.linearRampToValueAtTime(f * (wah ? 0.03 : 0.012), t + 0.25);
      lfo.connect(ld); ld.connect(o1.frequency); ld.connect(o2.frequency);
      if (wah) {                               // and a "wah-wah" filter sweep
        const wd = c.createGain(); wd.gain.value = f * 2.5;
        lfo.connect(wd); wd.connect(filt.frequency);
      }
      lfo.start(t); lfo.stop(t + d + 0.1);
    }
    o1.connect(filt); o2.connect(filt); filt.connect(g); g.connect(out);
    o1.start(t); o2.start(t); o1.stop(t + d + 0.1); o2.stop(t + d + 0.1);
  },
  tuba(t, midi, d) {
    const c = Sound.ctx, f = 440 * Math.pow(2, (midi - 69) / 12);
    const o = c.createOscillator(), o2 = c.createOscillator();
    o.type = 'triangle'; o2.type = 'square'; o.frequency.value = f; o2.frequency.value = f;
    const og = c.createGain(); og.gain.value = 0.25;
    const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 420;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.38, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(filt); o2.connect(og); og.connect(filt); filt.connect(g); g.connect(this.gain);
    o.start(t); o2.start(t); o.stop(t + d + 0.02); o2.stop(t + d + 0.02);
  },
  stab(t, midis, d) {
    const c = Sound.ctx, filt = c.createBiquadFilter(), g = c.createGain();
    filt.type = 'lowpass'; filt.frequency.value = 1800;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    filt.connect(g); g.connect(this.gain);
    for (const m of midis) {
      const o = c.createOscillator(); o.type = 'square'; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      o.connect(filt); o.start(t); o.stop(t + d + 0.02);
    }
  },
  drumNoise(t, dur, type, freq, vol, q = 1) {
    const c = Sound.ctx, n = c.createBufferSource(); n.buffer = Sound.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(this.gain);
    n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
  },
  kick(t) {
    const c = Sound.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + 0.18);
  },
  snare(t) { this.drumNoise(t, 0.12, 'bandpass', 1900, 0.32, 0.8); },
  hat(t, open) { this.drumNoise(t, open ? 0.12 : 0.03, 'highpass', 7500, open ? 0.08 : 0.06); },
  honk(t) {                                    // a taxi's "beep-beep"
    const c = Sound.ctx;
    for (const dt of [0, 0.13]) {
      const filt = c.createBiquadFilter(), g = c.createGain();
      filt.type = 'lowpass'; filt.frequency.value = 2200;
      g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.09, t + dt + 0.01);
      g.gain.setValueAtTime(0.09, t + dt + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.1);
      filt.connect(g); g.connect(this.gain);
      for (const f of [392, 415]) {
        const o = c.createOscillator(); o.type = 'square'; o.frequency.value = f;
        o.connect(filt); o.start(t + dt); o.stop(t + dt + 0.12);
      }
    }
  },

  // --- jingles (sound effects, so they play even with the music switched off) ---
  fanfare() {
    if (!Sound.on()) return;
    const t = Sound.ctx.currentTime + 0.02;
    [[0, 77, 0.1], [0.11, 81, 0.1], [0.22, 84, 0.1], [0.33, 89, 0.45]].forEach(([dt, n, d]) => {
      this.trumpet(t + dt, n, d, 0.16, Sound.master);
      this.trumpet(t + dt, n - 4, d, 0.1, Sound.master);
    });
  },
  sadTrombone() {
    if (!Sound.on()) return;
    const t = Sound.ctx.currentTime + 0.05;
    [[0, 58, 0.38], [0.45, 57, 0.38], [0.9, 56, 0.38], [1.35, 55, 1.2]].forEach(([dt, n, d], i) =>
      this.trumpet(t + dt, n, d, 0.2, Sound.master, i === 3));
  },
};

// A stack of mini backpacks lying on their sides, from the floor up to the gap.
function buildPile(topY, floorY) {
  const total = floorY - topY;
  const n = Math.max(1, Math.round(total / 56));
  const weights = Array.from({ length: n }, () => rand(0.85, 1.15));
  const sum = weights.reduce((a, b) => a + b, 0);
  const items = [], owned = BAG_DESIGNS.filter(b => wallet.owned.has(b.id));
  let y = floorY;
  weights.forEach((wt, i) => {
    const special = owned.length && Math.random() < 0.4 ? pick(owned) : null;
    const h = i === n - 1 ? y - topY : total * wt / sum;   // last bag reaches the gap exactly
    items.push({
      y: y - h, h, w: rand(76, 84), off: rand(-2, 2), tilt: rand(-0.04, 0.04),
      side: Math.random() < 0.5 ? -1 : 1,   // which way the domed top points
      pal: special ? special.pal : pick(BAG_PALETTES), ears: special ? special.ears : pick(BAG_EARS),
      motif: special ? special.motif : pick(BAG_MOTIFS), seed: Math.random() * 1000,
    });
    y -= h;
  });
  return { items };
}

function spawnObstacle(x) {
  const C = CONFIG, d = game.spawned;
  const top = C.ceilingY, floorY = H - C.floorHeight;
  let gap = Math.max(C.minGapSize, C.gapSize - d * C.gapShrinkPerPoint) + rand(-C.gapRandomness, C.gapRandomness);
  gap = Math.max(C.minGapSize * 0.95, gap);
  const margin = 50;
  const minC = top + margin + gap / 2, maxC = floorY - margin - gap / 2;
  const shift = Math.min(C.maxGapShift, C.maxGapShiftStart + d * C.maxGapShiftPerPoint);
  const center = clamp(game.lastGapCenter + rand(-shift, shift), minC, maxC);
  const o = { x, gapTop: center - gap / 2, gapBottom: center + gap / 2, passed: false };

  // Top hazard: ceiling fan or swinging lamp (lamps appear after a few obstacles).
  const len = o.gapTop - top - LAMP_SHADE_H;
  if (d >= 3 && len > 30 && Math.random() < 0.5) {
    let amp = Math.min(C.lampSwingMax, C.lampSwingStart + d * C.lampSwingPerPoint) * rand(0.8, 1.1);
    amp = Math.min(amp, Math.asin(Math.min(1, 70 / (len + LAMP_SHADE_H))));
    o.top = { type: 'lamp', len, amp, omega: rand(1.4, 2.3), phase: rand(0, TAU), color: pick(SHADE_COLORS) };
  } else {
    o.top = { type: 'fan', angle: rand(0, TAU), spin: rand(5, 9) * (Math.random() < 0.5 ? -1 : 1), bladeR: 56 };
  }
  // Bottom hazard: a stack of mini backpacks.
  o.pile = buildPile(o.gapBottom, floorY);

  // Something to grab halfway between the previous obstacle and this one:
  // a bottle of fizz, a chocolate bar or a Toot Coin banknote.
  if (d > 0) {
    const mx = x - C.obstacleSpacing / 2;
    const my = clamp((game.lastGapCenter + center) / 2 + rand(-40, 40), top + 45, floorY - 45);
    if (d >= C.fizzStartAfter && player.fizzT <= 0 && !game.pickups.some(q => q.type === 'fizz') &&
             Math.random() < C.fizzChance) addPickup('fizz', mx, my);
    else if (d >= C.chocStartAfter && !player.shield && !game.pickups.some(q => q.type === 'choc') &&
             Math.random() < C.chocChance) addPickup('choc', mx, my);
    else if (Math.random() < C.noteChance) addPickup('note', mx, my);
  }
  // Toot Coins: a little arc through the gap, or rarely a risky bundle of notes near its edge.
  if (d > 0 && Math.random() < C.coinRowChance) {
    const n = randInt(3, 5);
    for (let k = 0; k < n; k++) {
      const f = k / (n - 1) - 0.5;
      addPickup('coin', x + f * 30 * (n - 1), center + 7 - Math.cos(f * Math.PI) * 14);
    }
  } else if (d > 2 && Math.random() < C.stackChance) {
    addPickup('stack', x, Math.random() < 0.5 ? o.gapTop + 24 : o.gapBottom - 24);
  }

  game.obstacles.push(o);
  game.lastGapCenter = center;
  game.spawned++;
}

function addPickup(type, x, y) {
  game.pickups.push({ type, x, baseY: y, y, phase: rand(0, TAU), taken: false });
}

function collectPickup(q) {
  const C = CONFIG, p = player;
  q.taken = true;
  if (q.type === 'fizz') {
    p.fizzT = C.fizzDuration;
    p.smugT = 1.2;
    Sound.cork();
    emitSparkles(q.x, q.y, 16);
    emitBubbles(q.x, q.y, 18);
    popText('FIZZ BOOST!', q.x, q.y - 26, { size: 22, color: '#ff8fc8', max: 1.4, sub: 'Double points!' });
    return;
  }
  if (q.type === 'choc') {
    p.shield = true;
    p.smugT = 1.2;
    Sound.choc();
    emitSparkles(q.x, q.y, 14);
    popText('CHOCOLATE SHIELD!', q.x, q.y - 26, { size: 20, color: '#e8a860', max: 1.4, sub: 'One free bump' });
    return;
  }
  const v = q.type === 'coin' ? 1 : q.type === 'note' ? C.noteValue : C.stackValue;
  game.runCoins += v;
  wallet.add(v);
  if (q.type === 'coin') {
    Sound.coin();
    emitSparkles(q.x, q.y, 4);
    popText('+1', q.x, q.y - 14, { size: 13, color: '#ffd65a', max: 0.6, rot: 0 });
  } else {
    Sound.cash();
    emitSparkles(q.x, q.y, 14);
    popText(`+${v} TOOT COINS!`, q.x, q.y - 22, { size: 16, color: '#ffd65a', max: 1.1 });
  }
}

// The chocolate shield takes the hit: snap!
function snapShield() {
  const p = player, x = game.cam + p.x;
  p.shield = false;
  p.invulnT = CONFIG.shieldGrace;
  game.shake = Math.max(game.shake, 8);
  Sound.snap();
  for (let i = 0; i < 12; i++) {
    const a = rand(0, TAU), sp = rand(120, 300);
    addParticle({ type: 'chunk', x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140,
      r0: rand(3, 5.5), rot: rand(0, TAU), vr: rand(-12, 12), life: 0, max: rand(0.6, 1) });
  }
  popText('SNAP!', x + 18, p.y - 30, { size: 28, color: '#e8a860', max: 1.1, sub: 'Saved by chocolate!' });
}

// Returns the cause of a hit ('fan' | 'lamp' | 'bags') or null.
function obstacleHit(o, px, py, r) {
  const top = CONFIG.ceilingY, floorY = H - CONFIG.floorHeight;
  if (circleRect(px, py, r, o.x - 40, o.gapBottom + 4, 80, floorY - o.gapBottom)) return 'bags';
  if (o.top.type === 'fan') {
    const by = o.gapTop - 9, R = o.top.bladeR;
    if (circleRect(px, py, r, o.x - R, by - 8, R * 2, 16)) return 'fan';
    if (circleRect(px, py, r, o.x - 18, by - 20, 36, 22)) return 'fan';
    if (circleRect(px, py, r, o.x - 4, top, 8, Math.max(0, by - 20 - top + 1))) return 'fan';
  } else {
    // Transform into the lamp's rotated frame (pivot at the ceiling).
    const L = o.top.len, th = lampAngle(o), c = Math.cos(th), s = Math.sin(th);
    const dx = px - o.x, dy = py - top;
    const lx = dx * c - dy * s, ly = dx * s + dy * c;
    if (circleRect(lx, ly, r, -27, L, 54, LAMP_SHADE_H)) return 'lamp';
    if (circleRect(lx, ly, r, -2, 0, 4, L)) return 'lamp';
  }
  return null;
}

// --- Particles (world coordinates unless p.screen is set) ---
function addParticle(p) {
  if (game.particles.length > 900) game.particles.shift();
  game.particles.push(p);
}

function emitGas(x, y, dx, dy, count, sizeMul = 1, speedMul = 1) {
  const base = Math.atan2(dy, dx), fizz = player.fizzT > 0 && game.state === 'play';
  for (let i = 0; i < count; i++) {
    const a = base + rand(-0.55, 0.55), sp = rand(60, 200) * speedMul;
    const hue = fizz ? rand(318, 345) : rand(68, 112), light = rand(52, 70);
    if (fizz && Math.random() < 0.3) emitBubbles(x, y, 1);
    addParticle({
      type: 'gas',
      x: x + rand(-3, 3), y: y + rand(-3, 3),
      vx: Math.cos(a) * sp - 30, vy: Math.sin(a) * sp,
      r0: rand(3, 6) * sizeMul, r1: rand(11, 20) * sizeMul,
      life: 0, max: rand(0.55, 1.15),
      c1: `hsl(${hue},62%,${light}%)`, c2: `hsl(${hue},75%,${Math.min(90, light + 18)}%)`,
    });
  }
}

function emitBubbles(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), sp = rand(30, 140);
    addParticle({ type: 'bubble', x: x + rand(-4, 4), y: y + rand(-4, 4), vx: Math.cos(a) * sp - 30, vy: Math.sin(a) * sp,
      r0: rand(1.5, 3.8), life: 0, max: rand(0.6, 1.3) });
  }
}

function emitStars(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), sp = rand(120, 320);
    addParticle({ type: 'star', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      r0: rand(4, 8), rot: rand(0, TAU), vr: rand(-10, 10), life: 0, max: rand(0.6, 1.1),
      color: pick(['#ffe066', '#fff3b0', '#ffb3c7']) });
  }
}

function emitSparkles(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), sp = rand(60, 220);
    addParticle({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r0: rand(1.5, 3.5), life: 0, max: rand(0.35, 0.7), color: pick(['#fff', '#ffe066', '#9be564']) });
  }
}

function popText(text, x, y, opts = {}) {
  addParticle({ type: 'text', text, x, y, vx: opts.vx || 0, vy: opts.vy ?? -50,
    size: opts.size || 20, color: opts.color || '#d8ff7a', rot: opts.rot ?? rand(-0.25, 0.25),
    life: 0, max: opts.max || 0.9, screen: !!opts.screen, sub: opts.sub || '' });
}

function updateParticles(dt) {
  const ps = game.particles;
  let j = 0;
  for (let i = 0; i < ps.length; i++) {
    const q = ps[i];
    q.life += dt;
    if (q.life >= q.max) continue;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.type === 'gas') {
      const k = 1 - Math.min(1, 2.2 * dt);
      q.vx *= k; q.vy = q.vy * k - 28 * dt;   // gas drifts upward as it slows
    } else if (q.type === 'star' || q.type === 'chunk') {
      q.vy += 700 * dt; q.rot += q.vr * dt;
    } else if (q.type === 'spark') {
      q.vx *= 1 - 3 * dt; q.vy *= 1 - 3 * dt;
    } else if (q.type === 'bubble') {
      q.vx *= 1 - 2 * dt; q.vy = q.vy * (1 - 2 * dt) - 70 * dt;
    } else if (q.type === 'text') {
      q.vy *= 1 - 1.8 * dt;
    }
    ps[j++] = q;
  }
  ps.length = j;
}

// Where the jetpack nozzle is in world space, and which way it points.
function nozzle() {
  const p = player, sx = 1 - p.stretch * 0.6, sy = 1 + p.stretch;
  const lx = -15.5 * sx, ly = 19 * sy;
  const c = Math.cos(p.angle), s = Math.sin(p.angle);
  return {
    x: game.cam + p.x + lx * c - ly * s,
    y: p.y + lx * s + ly * c,
    dx: -0.35 * c - s,
    dy: -0.35 * s + c,
  };
}

/* ---------------------------------------------------------------------
   8. INPUT — tap / click / space; hold for sustained thrust
   --------------------------------------------------------------------- */
const input = { held: false, pointers: new Set(), keys: new Set() };
const ACTION_KEYS = new Set(['Space', 'ArrowUp', 'KeyW', 'Enter']);

function pointerToView(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const MUTE_BTN = { r: 20, get x() { return W - 30; }, y: 22 };
const MUSIC_BTN = { r: 20, get x() { return W - 72; }, y: 22 };
function inMuteButton(x, y) { return Math.hypot(x - MUTE_BTN.x, y - MUTE_BTN.y) < MUTE_BTN.r + 8; }
function inMusicButton(x, y) { return Math.hypot(x - MUSIC_BTN.x, y - MUSIC_BTN.y) < MUSIC_BTN.r + 2; }
function toggleMusic() { Music.toggle(); Sound.click(); }

// Installing as an app: browsers that support it hand us a prompt we can show
// from an "INSTALL APP" button. It must be shown on pointer *up* to count as
// a tap on touch screens, so the button only arms it on the way down.
let installPrompt = null, installArmed = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; });
function showInstallPrompt() {
  if (!installPrompt) return;
  const pr = installPrompt;
  installPrompt = null;
  pr.prompt();
}
function toggleMute() { Sound.setMuted(!Sound.muted); if (!Sound.muted) Sound.click(); }

function pressStart() { input.held = true; handlePress(); }
function pressEnd() {
  if (input.pointers.size || input.keys.size) return;
  input.held = false;
  handleRelease();
}

function handlePress() {
  switch (game.state) {
    case 'title': startGame(); flap(); break;
    case 'play': flap(); break;
    case 'over': if (game.overT > 0.6) { startGame(); flap(); } break;
  }
}
function handleRelease() {
  if (player.thrusting) endThrust();
  player.holdTime = 0;
}

window.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();
  Sound.unlock();
  const v = pointerToView(e);
  if (inMuteButton(v.x, v.y)) { toggleMute(); return; }
  if (inMusicButton(v.x, v.y)) { toggleMusic(); return; }
  if (hitButton(v) || game.state === 'shop') return;
  input.pointers.add(e.pointerId);
  pressStart();
}, { passive: false });
const pointerUp = e => {
  Sound.unlock();
  if (installArmed) { installArmed = false; showInstallPrompt(); }
  if (input.pointers.delete(e.pointerId)) pressEnd();
};
window.addEventListener('pointerup', pointerUp);
window.addEventListener('pointercancel', pointerUp);

window.addEventListener('keydown', e => {
  if (e.code === 'KeyM') { Sound.unlock(); toggleMute(); return; }
  if (e.code === 'KeyN') { Sound.unlock(); toggleMusic(); return; }
  if (game.state === 'shop') {
    if (e.code === 'Escape' || ACTION_KEYS.has(e.code)) { e.preventDefault(); if (!e.repeat) closeShop(); }
    return;
  }
  if (e.code === 'KeyS' && (game.state === 'title' || game.state === 'over')) { Sound.unlock(); openShop(); return; }
  if (e.code === 'Escape' && game.state === 'over') { goToMenu(); return; }
  if (!ACTION_KEYS.has(e.code)) return;
  e.preventDefault();
  if (e.repeat || input.keys.has(e.code)) return;
  Sound.unlock();
  input.keys.add(e.code);
  pressStart();
});
window.addEventListener('keyup', e => { if (input.keys.delete(e.code)) pressEnd(); });

// Stop the page from scrolling, zooming or showing menus on mobile.
['touchstart', 'touchmove', 'gesturestart', 'dblclick', 'contextmenu'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchend', () => Sound.unlock(), { passive: true });

function releaseAll() {
  input.pointers.clear(); input.keys.clear();
  if (input.held) { input.held = false; handleRelease(); }
  Sound.stopHold();
}
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseAll();
  lastTime = performance.now();
});

/* ---------------------------------------------------------------------
   9. UPDATE — runs at a fixed timestep
   --------------------------------------------------------------------- */
function flap() {
  const p = player, C = CONFIG;
  const climbBefore = clamp(-p.vy / 400, 0, 1);
  p.vy = C.flapImpulse;
  p.holdTime = 0;
  p.stretch = 0.28; p.stretchV = 0;
  const big = Math.random() < 0.12 || climbBefore > 0.8;
  const nz = nozzle();
  emitGas(nz.x, nz.y, nz.dx, nz.dy, 10 + Math.round(12 * climbBefore) + (big ? 12 : 0),
    1 + climbBefore * 0.8 + (big ? 0.5 : 0), 1 + climbBefore * 0.5);
  Sound.fart({ power: 0.6 + climbBefore * 0.5 + (big ? 0.4 : 0), fizzy: p.fizzT > 0 });
  if (big) {
    p.smugT = 0.6;
    popText(pick(PUFF_WORDS), nz.x - 24, nz.y + 8, { size: 18, vx: -40 });
  }
}

function endThrust() {
  const p = player;
  p.thrusting = false;
  Sound.stopHold();
  if (p.thrustTime > 0.35) {           // a big puff earns a smug look
    p.smugT = 0.9;
    Sound.fart({ power: 0.4, dur: rand(0.08, 0.14), noDouble: true });
    const nz = nozzle();
    popText(pick(PUFF_WORDS), nz.x - 24, nz.y + 8, { size: 16, vx: -40 });
  }
  p.thrustTime = 0;
}

function die(cause) {
  const p = player;
  game.state = 'dying';
  game.deathT = 0;
  game.deathCause = cause;
  game.deathSpeed = game.speed;
  Music.stop();
  game.diedFizzy = p.fizzT > 0;
  p.fizzT = 0; p.shield = false; p.invulnT = 0;
  if (p.thrusting) { p.thrusting = false; Sound.stopHold(); }
  p.vy = cause === 'floor' ? -460 : cause === 'ceiling' ? 120 : -320;
  p.spin = (Math.random() < 0.5 ? -1 : 1) * rand(10, 15);
  p.stretch = -0.35;
  game.shake = 16; game.flash = 1;
  Sound.crash(); Sound.deathFart();
  emitStars(game.cam + p.x, p.y, 12);
  popText(pick(['BONK!', 'OOF!', 'WHUMP!', 'BOING!']), game.cam + p.x + 20, p.y - 30,
    { size: 30, color: '#ffe066', max: 1.1 });
}

function gameOver() {
  game.state = 'over';
  game.overT = 0;
  Music.sadTrombone();
  game.newBest = game.score > game.best;
  if (game.newBest) { game.best = game.score; store.set('tootPilot.best', game.best); }
  const extra = game.diedFizzy ? MESSAGES.fizz : MESSAGES[game.deathCause] || [];
  game.message = pick(MESSAGES.any.concat(extra, extra));
}

function addScore(n) {
  game.score += n;
  game.scorePulse = 1;
  const r = rankIndex(game.score);
  if (r > game.rank) {
    game.rank = r;
    Sound.rankUp();
    popText('RANK UP!', W / 2, H * 0.3, { screen: true, size: 30, color: '#ffe066', vy: -20, rot: 0, max: 1.8, sub: RANKS[r][1] });
    launchFireworks(3);                     // a celebration in every window
  }
}

function step(dt) {
  const C = CONFIG, p = player;
  game.time += dt;
  game.prevCam = game.cam;
  p.prevY = p.y;
  game.shake = Math.max(0, game.shake - dt * 30);
  game.flash = Math.max(0, game.flash - dt * 3);
  game.scorePulse = Math.max(0, game.scorePulse - dt * 4);
  p.smugT -= dt;

  for (const o of game.obstacles) if (o.top.type === 'fan') o.top.angle += o.top.spin * dt;

  switch (game.state) {
    case 'title':
    case 'shop': {
      game.cam += 80 * dt;
      const ph = game.time * 2.6;
      p.y = H * 0.45 + Math.sin(ph) * 14;
      p.vy = Math.cos(ph) * 36;
      p.angle = lerp(p.angle, -0.1 + Math.sin(ph) * 0.05, 0.1);
      game.idleT -= dt;
      if (game.idleT <= 0) {                // little idle puffs to keep her afloat
        game.idleT = rand(0.35, 0.8);
        const nz = nozzle();
        emitGas(nz.x, nz.y, nz.dx, nz.dy, randInt(3, 6), 0.7, 0.6);
      }
      break;
    }
    case 'play': updatePlay(dt); break;
    case 'dying': updateDying(dt); break;
    case 'over': game.overT += dt; break;
  }

  // Squash & stretch spring towards a target based on motion.
  const target = p.thrusting ? 0.12 : (game.state === 'play' ? clamp(p.vy / 3000, -0.05, 0.1) : 0);
  p.stretchV += (-260 * (p.stretch - target) - 12 * p.stretchV) * dt;
  p.stretch += p.stretchV * dt;

  // Blinking
  p.blinkT -= dt;
  if (p.blinkT < -0.12) p.blinkT = rand(1.5, 4);

  // Facial expression
  if (game.state === 'dying' || game.state === 'over') p.expression = 'dead';
  else if (game.state === 'play' && p.panic) p.expression = 'panic';
  else if (p.smugT > 0) p.expression = 'smug';
  else if (game.state === 'play' && (p.thrusting || p.vy < -120)) p.expression = 'determined';
  else p.expression = 'happy';

  updateSpeech(dt);
  updateFireworks(dt);
  updateParticles(dt);
}

function updatePlay(dt) {
  const C = CONFIG, p = player, r = C.playerRadius;
  const floorY = H - C.floorHeight;
  game.speed = Math.min(C.maxScrollSpeed, C.scrollSpeed + game.score * C.scrollSpeedPerPoint);
  game.cam += game.speed * dt;

  // --- Sustained thrust while held ---
  if (input.held) p.holdTime += dt;
  const climb = clamp(-p.vy / -C.maxRiseSpeed, 0, 1);
  if (input.held && p.holdTime >= C.holdDelay) {
    p.vy -= C.holdThrust * dt;
    p.thrusting = true;
    p.thrustTime += dt;
    Sound.startHold();
    Sound.updateHold(climb, p.fizzT > 0);
  } else if (p.thrusting) endThrust();

  p.invulnT = Math.max(0, p.invulnT - dt);

  // --- Fizz boost: double points, and a slightly tipsy wobble ---
  if (p.fizzT > 0) {
    p.fizzT -= dt;
    p.vy += Math.sin(game.time * 6.5) * C.fizzWobble * dt;
    if (p.fizzT <= 0) {
      Sound.fizzOut();
      popText('Fizz worn off', game.cam + p.x, p.y - 34, { size: 14, color: '#ffd1e0', max: 1 });
    }
  }

  // --- Physics ---
  p.vy = clamp(p.vy + C.gravity * dt, C.maxRiseSpeed, C.maxFallSpeed);
  p.y += p.vy * dt;
  p.angle = lerp(p.angle, clamp(p.vy / 900, -0.35, 0.55), 1 - Math.exp(-10 * dt));

  // --- Gas trail: bigger and denser the faster she climbs ---
  if (p.vy < -40 || p.thrusting) {
    p.trailAcc += ((p.thrusting ? 70 : 15) + 110 * climb) * dt;
    if (p.trailAcc >= 1) {
      const nz = nozzle();
      const n = Math.floor(p.trailAcc);
      p.trailAcc -= n;
      emitGas(nz.x, nz.y, nz.dx, nz.dy, n, 0.8 + 1.3 * climb, 0.8 + 0.6 * climb);
    }
  }

  // --- Obstacles ---
  while (game.nextObstacleX < game.cam + W + 150) {
    spawnObstacle(game.nextObstacleX);
    game.nextObstacleX += C.obstacleSpacing;
  }
  game.obstacles = game.obstacles.filter(o => o.x > game.cam - 200);
  game.pickups = game.pickups.filter(q => q.x > game.cam - 100 && !q.taken);

  const pwx = game.cam + p.x;
  let near = p.y - r < C.ceilingY + 28 || p.y + r > floorY - 28;
  for (const o of game.obstacles) {
    if (!o.passed && o.x < pwx - 10) {
      o.passed = true;
      const pts = p.fizzT > 0 ? 2 : 1;
      addScore(pts);
      Sound.blip();
      if (pts > 1) popText('x2', pwx + 12, p.y - 30, { size: 16, color: '#ff8fc8', max: 0.7 });
    }
    const dx = o.x - pwx;
    if (dx > -160 && dx < 160) {
      const hit = obstacleHit(o, pwx, p.y, r * 0.9);
      if (hit && p.invulnT <= 0) {
        if (p.shield) snapShield(); else { die(hit); return; }
      }
      if (dx > -60 && obstacleHit(o, pwx, p.y, r + 24)) near = true;
    }
  }
  p.panic = near;

  // --- Toot Coins, fizz bottles & chocolate ---
  for (const q of game.pickups) {
    if (q.taken) continue;
    q.y = q.baseY + Math.sin(game.time * 3 + q.phase) * (q.type === 'coin' ? 3 : 6);
    if (Math.hypot(q.x - pwx, q.y - p.y) < r + (q.type === 'coin' ? 11 : 16)) collectPickup(q);
  }

  // --- Floor & ceiling ---
  // (a shield, or the safe spell after one snaps, turns these into bounces)
  if (p.y - r < C.ceilingY) {
    p.y = C.ceilingY + r;
    if (p.invulnT > 0) p.vy = Math.max(p.vy, 120);
    else if (p.shield) { snapShield(); p.vy = 200; }
    else { die('ceiling'); return; }
  }
  if (p.y + r > floorY) {
    p.y = floorY - r;
    if (p.invulnT > 0) p.vy = Math.min(p.vy, -420);
    else if (p.shield) { snapShield(); p.vy = -480; }
    else { die('floor'); return; }
  }
}

function updateDying(dt) {
  const C = CONFIG, p = player, r = C.playerRadius;
  const floorY = H - C.floorHeight;
  game.deathT += dt;
  game.deathSpeed *= Math.pow(0.12, dt);   // the world skids to a halt
  game.cam += game.deathSpeed * dt;

  p.vy += C.gravity * dt;
  p.y += p.vy * dt;
  p.angle += p.spin * dt;
  p.spin *= Math.pow(0.5, dt);
  if (p.y > floorY - r) {
    p.y = floorY - r;
    if (Math.abs(p.vy) > 140) { p.vy *= -0.45; p.stretch = -0.3; Sound.bounce(); game.shake = Math.max(game.shake, 5); }
    else p.vy = 0;
  }
  if (p.y < C.ceilingY + r) { p.y = C.ceilingY + r; p.vy = Math.abs(p.vy) * 0.3; }

  // Spinning out of control... still tooting.
  p.trailAcc += 100 * Math.max(0, 1 - game.deathT / 1.7) * dt;
  if (p.trailAcc >= 1) {
    const nz = nozzle(), n = Math.floor(p.trailAcc);
    p.trailAcc -= n;
    emitGas(nz.x, nz.y, nz.dx, nz.dy, n, 1.1, 1.2);
  }
  if (game.deathT > 1.5) gameOver();
}

/* ---------------------------------------------------------------------
   10. RENDER: BACKGROUND (parallax layers)
   --------------------------------------------------------------------- */
const FONT = '"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",system-ui,sans-serif';
const BOOK_COLORS = ['#e05d5d', '#5d8de0', '#e0c05d', '#6cc48a', '#a56de0', '#e08a5d', '#4fb3b3'];

const dawnFactor = () => (game.state === 'title' || game.state === 'shop' ? 0 : clamp((game.score - 20) / 40, 0, 1));

// Windows sit on a parallax layer; this lists the ones on screen (x in view space).
const WINDOW_SPACING = 620, WINDOW_Y = 78, WINDOW_W = 120, WINDOW_H = 160;
function visibleWindows(cam) {
  const wcam = cam * 0.4, out = [];
  for (let i = Math.floor((wcam - 400) / WINDOW_SPACING); i <= Math.floor((wcam + W + 100) / WINDOW_SPACING); i++) {
    out.push({ i, x: i * WINDOW_SPACING + 80 + hash2(i, 3) * 240 - wcam });
  }
  return out;
}

function celestialX(cam, offset) {
  const span = W + 300;
  let x = (W * 0.78 - cam * 0.05 + offset) % span;
  if (x < 0) x += span;
  return x - 150;
}

function drawBackground(cam) {
  const C = CONFIG, floorY = H - C.floorHeight, top = C.ceilingY;
  const dawn = dawnFactor();

  // Layer 0: wallpaper (slowest)
  ctx.save();
  ctx.translate(-((cam * 0.2) % 56), 0);
  ctx.fillStyle = wallPattern;
  ctx.fillRect(-60, 0, W + 200, H);
  ctx.restore();

  // Layer 1: windows with the night sky (and a moving moon / sun)
  for (const wn of visibleWindows(cam)) drawWindow(wn.x, WINDOW_Y, WINDOW_W, WINDOW_H, wn.i, dawn, cam);

  // Layer 2: shelves, picture frames, clocks
  const MS = 280, mcam = cam * 0.6;
  for (let i = Math.floor((mcam - 300) / MS); i <= Math.floor((mcam + W + 50) / MS); i++) {
    const h = hash2(i, 7), mx = i * MS + hash2(i, 8) * 90 - mcam;
    if (h < 0.34) drawShelf(mx, 335 + hash2(i, 9) * 30, i);
    else if (h < 0.68) drawFrame(mx, 300 + hash2(i, 10) * 40, i);
    else if (h < 0.84) drawClock(mx + 40, 350);
  }

  // Layer 3: furniture against the wall
  const NS = 520, ncam = cam * 0.8;
  for (let i = Math.floor((ncam - 300) / NS); i <= Math.floor((ncam + W + 50) / NS); i++) {
    const h = hash2(i, 11), nx = i * NS + hash2(i, 12) * 200 - ncam;
    if (h < 0.3) drawNightstand(nx, floorY);
    else if (h < 0.55) drawRadiator(nx, floorY);
    else if (h < 0.8) drawPlant(nx, floorY, i);
    else drawTeddy(nx + 30, floorY);
  }

  // Dim the background so the obstacles pop.
  ctx.fillStyle = 'rgba(18,8,40,0.3)';
  ctx.fillRect(-30, 0, W + 60, H);

  // Ceiling
  ctx.fillStyle = '#3b3266';
  ctx.fillRect(-30, -30, W + 60, top + 30);
  ctx.fillStyle = '#cfc2ea';
  ctx.fillRect(-30, top - 9, W + 60, 9);
  ctx.fillStyle = '#a999cf';
  for (let x = -((cam % 16)) - 16; x < W + 20; x += 16) ctx.fillRect(x, top - 9, 8, 4);
  ctx.fillRect(-30, top - 2, W + 60, 2);
  const cg = ctx.createLinearGradient(0, top, 0, top + 22);
  cg.addColorStop(0, 'rgba(0,0,0,0.3)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg; ctx.fillRect(-30, top, W + 60, 22);

  // Floor: skirting board + floorboards (scroll at full speed)
  ctx.fillStyle = '#ece2d2'; ctx.fillRect(-30, floorY, W + 60, 12);
  ctx.fillStyle = '#c4b8a6'; ctx.fillRect(-30, floorY + 10, W + 60, 2);
  ctx.fillStyle = '#7c5134'; ctx.fillRect(-30, floorY + 12, W + 60, H - floorY + 30);
  ctx.strokeStyle = '#5e3b25'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let row = 0; row < 4; row++) {
    const y = floorY + 12 + row * 16;
    ctx.moveTo(-30, y); ctx.lineTo(W + 30, y);
    for (let x = -(((cam + row * 37) % 110 + 110) % 110); x < W + 30; x += 110) {
      ctx.moveTo(x, y); ctx.lineTo(x, y + 16);
    }
  }
  ctx.stroke();
  // Rugs every so often
  const RS = 900;
  for (let i = Math.floor((cam - 200) / RS); i <= Math.floor((cam + W + 200) / RS); i++) {
    if (hash2(i, 40) < 0.5) continue;
    const rx = i * RS + 300 - cam, ry = floorY + 38;
    ctx.fillStyle = '#c95f86'; ctx.beginPath(); ctx.ellipse(rx, ry, 120, 18, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f0c75e'; ctx.beginPath(); ctx.ellipse(rx, ry, 95, 13, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5ab0a5'; ctx.beginPath(); ctx.ellipse(rx, ry, 65, 8, 0, 0, TAU); ctx.fill();
  }
}

function drawWindow(x, y, w, h, seed, dawn, cam) {
  if (x > W + 60 || x + w < -60) return;
  // frame
  ctx.fillStyle = '#d9cbb4';
  roundRect(ctx, x - 9, y - 9, w + 18, h + 18, 4); ctx.fill();
  // sky (clipped to the glass)
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, mixColor('#0b1236', '#5a7fc4', dawn));
  g.addColorStop(1, mixColor('#2a3577', '#ffb37a', dawn));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  // stars
  ctx.fillStyle = `rgba(255,255,230,${0.9 * (1 - dawn)})`;
  for (let k = 0; k < 10; k++) {
    const s = Math.sin(game.time * 3 + k * 1.7 + seed) > 0.6 ? 2 : 1.2;
    ctx.fillRect(x + hash2(seed, k) * w, y + hash2(seed, k + 20) * h * 0.75, s, s);
  }
  // moon
  const mx = celestialX(cam, 0), my = 125 + dawn * 200;
  const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 55);
  mg.addColorStop(0, 'rgba(255,245,200,0.35)'); mg.addColorStop(1, 'rgba(255,245,200,0)');
  ctx.fillStyle = mg; ctx.fillRect(mx - 55, my - 55, 110, 110);
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(mx, my, 20, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(200,190,150,0.5)';
  ctx.beginPath(); ctx.arc(mx - 6, my - 4, 4, 0, TAU); ctx.arc(mx + 7, my + 6, 3, 0, TAU); ctx.arc(mx + 4, my - 9, 2, 0, TAU); ctx.fill();
  // sun rises as the score climbs (she's been up all night!)
  if (dawn > 0) {
    const sx = celestialX(cam, -W * 0.5), sy = 380 - dawn * 250;
    ctx.fillStyle = 'rgba(255,220,120,0.35)'; ctx.beginPath(); ctx.arc(sx, sy, 36, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(sx, sy, 24, 0, TAU); ctx.fill();
  }
  drawPlane(cam, dawn);
  drawFireworks(cam);
  // rooftops
  ctx.fillStyle = mixColor('#151a3d', '#6a4a6a', dawn);
  for (let k = 0; k < 4; k++) {
    const bx = x + k * 34 - 6, bh = 18 + hash2(seed, k + 50) * 34;
    ctx.fillRect(bx, y + h - bh, 30, bh);
    ctx.beginPath(); ctx.moveTo(bx - 3, y + h - bh); ctx.lineTo(bx + 15, y + h - bh - 12); ctx.lineTo(bx + 33, y + h - bh); ctx.fill();
  }
  ctx.fillStyle = '#ffd86b';
  for (let k = 0; k < 4; k++) if (hash2(seed, k + 60) < 0.5) ctx.fillRect(x + k * 34 + 6, y + h - 12, 5, 6);
  ctx.restore();
  // mullions & shine
  ctx.fillStyle = '#d9cbb4';
  ctx.fillRect(x + w / 2 - 3, y, 6, h);
  ctx.fillRect(x, y + h * 0.45 - 3, w, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 30, y); ctx.lineTo(x + 5, y + 40); ctx.lineTo(x, y + 40); ctx.fill();
  // sill
  ctx.fillStyle = '#e8dcc6'; ctx.fillRect(x - 16, y + h + 6, w + 32, 8);
  // curtains + rod
  drawCurtain(x - 26, y - 16, 36, h + 40, false);
  drawCurtain(x + w - 10, y - 16, 36, h + 40, true);
  ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x - 34, y - 16); ctx.lineTo(x + w + 34, y - 16); ctx.stroke();
  ctx.fillStyle = '#c99a5a';
  ctx.beginPath(); ctx.arc(x - 36, y - 16, 5, 0, TAU); ctx.arc(x + w + 36, y - 16, 5, 0, TAU); ctx.fill();
}

// A plane crosses the sky every so often; it's only seen through the windows.
function drawPlane(cam, dawn) {
  const span = 2600;
  let x = (game.time * 45 - cam * 0.05) % span;
  if (x < 0) x += span;
  x -= 300;
  const y = 108 + Math.sin(game.time * 0.3) * 8;
  if (x < -140 || x > W + 60) return;
  const g = ctx.createLinearGradient(x - 130, 0, x - 14, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${0.28 * (1 - dawn * 0.5)})`);
  ctx.strokeStyle = g; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 130, y + 1); ctx.lineTo(x - 14, y + 1); ctx.stroke();
  ctx.fillStyle = mixColor('#4a5288', '#e9ecf5', dawn);
  ctx.beginPath(); ctx.moveTo(x - 2, y); ctx.lineTo(x - 7, y - 6); ctx.lineTo(x - 4, y - 6); ctx.lineTo(x + 4, y); ctx.fill();   // far wing
  ctx.beginPath(); ctx.ellipse(x, y, 13, 2.8, 0, 0, TAU); ctx.fill();                                                         // fuselage
  ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x - 14, y - 7); ctx.lineTo(x - 11, y - 7); ctx.lineTo(x - 6, y); ctx.fill();  // tail
  ctx.beginPath(); ctx.moveTo(x - 1, y + 1); ctx.lineTo(x - 8, y + 8); ctx.lineTo(x - 4, y + 8); ctx.lineTo(x + 5, y + 1); ctx.fill(); // near wing
  ctx.fillStyle = '#ffe9a8';
  for (let k = 0; k < 5; k++) ctx.fillRect(x - 6 + k * 3, y - 1, 1.4, 1.2);
  const blink = (game.time * 1.4) % 1 < 0.18;
  if (blink) {
    ctx.fillStyle = '#ff5050'; ctx.beginPath(); ctx.arc(x - 7.5, y + 8, 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5dff7a'; ctx.beginPath(); ctx.arc(x - 6.5, y - 6, 1.4, 0, TAU); ctx.fill();
  }
  if ((game.time * 1.4 + 0.5) % 1 < 0.1) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 13.5, y - 7, 1.4, 0, TAU); ctx.fill(); }
}

// Fireworks live in "sky space" (like the moon) so they stay put while a window slides past.
function launchFireworks(perWindow) {
  const wins = visibleWindows(game.cam).filter(wn => wn.x + WINDOW_W > 30 && wn.x < W - 30);
  for (const wn of wins) {
    for (let k = 0; k < perWindow; k++) {
      game.fireworks.push({
        sx: wn.x + WINDOW_W * rand(0.4, 0.95) + game.cam * 0.05, y: rand(100, 160),
        t: -k * rand(0.25, 0.5), hue: rand(0, 360), n: randInt(14, 22), r: rand(24, 38), seed: rand(0, TAU), popped: false,
      });
    }
  }
}

// Every so often she pipes up with one of her sayings.
function updateSpeech(dt) {
  const st = game.state;
  if (st !== 'play' && st !== 'title' && st !== 'shop') { game.say = null; return; }
  if (game.say) {
    game.say.t += dt;
    if (game.say.t > 1.9) game.say = null;
    return;
  }
  game.sayT -= dt;
  if (game.sayT <= 0) {
    game.sayT = rand(9, 17);
    const last = game.lastSaying;
    const options = SAYINGS.length > 1 ? SAYINGS.filter(t => t !== last) : SAYINGS;
    game.say = { text: pick(options), t: 0 };
    game.lastSaying = game.say.text;
  }
}

function drawSpeech(py) {
  const sy = game.say;
  if (!sy || game.state === 'shop') return;
  const size = 15;
  ctx.font = `bold ${size}px ${FONT}`;
  const bw = ctx.measureText(sy.text).width + 22, bh = 30;
  const hx = player.x + 8, hy = py - 24;                  // top of her head
  const side = py - 50 - bh < CONFIG.ceilingY + 6;        // no room above: put it beside her
  const bx = side ? player.x + 30 : clamp(player.x + 4, 6, W - bw - 6);
  const by = side ? Math.max(CONFIG.ceilingY + 6, py - 26 - bh / 2) : py - 50 - bh;
  const pop = sy.t < 0.18 ? easeOutBack(sy.t / 0.18) : 1;
  ctx.save();
  ctx.globalAlpha = sy.t > 1.6 ? Math.max(0, (1.9 - sy.t) / 0.3) : 1;
  ctx.translate(hx, hy); ctx.scale(pop, pop); ctx.translate(-hx, -hy);
  // Bubble and tail are outlined with a double-width stroke and then filled
  // over, so the seam where they meet disappears.
  const tail = () => {
    ctx.beginPath();
    if (side) {                                           // pointing left at her face
      const ty = by + bh / 2;
      ctx.moveTo(bx + 6, ty - 6); ctx.lineTo(player.x + 18, py - 14); ctx.lineTo(bx + 6, ty + 5);
    } else {                                              // pointing down at her head
      const tx = clamp(hx + 4, bx + 14, bx + bw - 14);
      ctx.moveTo(tx - 7, by + bh - 6); ctx.lineTo(hx, Math.max(hy, by + bh + 8)); ctx.lineTo(tx + 6, by + bh - 6);
    }
    ctx.closePath();
  };
  ctx.strokeStyle = '#2b1740'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  roundRect(ctx, bx, by, bw, bh, 14); ctx.stroke();
  tail(); ctx.stroke();
  ctx.fillStyle = '#fff';
  roundRect(ctx, bx, by, bw, bh, 14); ctx.fill();
  tail(); ctx.fill();
  drawText(sy.text, bx + bw / 2, by + bh / 2 + 1, size, '#6a3f8a', 'center', false);
  ctx.restore();
}

function updateFireworks(dt) {
  game.fwT -= dt;
  if (game.fwT <= 0) {
    game.fwT = rand(7, 15);
    const wins = visibleWindows(game.cam).filter(wn => wn.x + WINDOW_W > W * 0.3 && wn.x < W - 60);
    if (wins.length) {
      const wn = pick(wins);
      game.fireworks.push({ sx: wn.x + WINDOW_W * rand(0.5, 0.95) + game.cam * 0.05, y: rand(100, 160),
        t: 0, hue: rand(0, 360), n: randInt(14, 22), r: rand(24, 38), seed: rand(0, TAU), popped: false });
    }
  }
  for (const f of game.fireworks) {
    f.t += dt;
    if (!f.popped && f.t >= 0.6) { f.popped = true; Sound.firework(); }
  }
  game.fireworks = game.fireworks.filter(f => f.t < 2.4);
}

function drawFireworks(cam) {
  for (const f of game.fireworks) {
    if (f.t < 0) continue;
    const x = f.sx - cam * 0.05;
    if (x < -60 || x > W + 60) continue;
    if (f.t < 0.6) {                                   // rocket climbing
      const k = f.t / 0.6, ry = 240 - (240 - f.y) * (1 - (1 - k) * (1 - k));
      ctx.strokeStyle = `hsla(${f.hue},90%,80%,0.5)`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x, ry + 10); ctx.stroke();
      ctx.fillStyle = '#fff8d0'; ctx.beginPath(); ctx.arc(x, ry, 1.6, 0, TAU); ctx.fill();
      continue;
    }
    const u = f.t - 0.6, a = clamp(1 - u / 1.7, 0, 1);
    if (u < 0.15) {
      ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - u / 0.15)})`;
      ctx.beginPath(); ctx.arc(x, f.y, 16, 0, TAU); ctx.fill();
    }
    const d = f.r * (1 - Math.exp(-4 * u));
    ctx.globalAlpha = a;
    for (let k = 0; k < f.n; k++) {
      const ang = k / f.n * TAU + f.seed, c = Math.cos(ang), sn = Math.sin(ang), drop = 22 * u * u;
      ctx.fillStyle = k % 3 === 0 ? '#fff' : `hsl(${f.hue + (k % 2) * 35},95%,66%)`;
      ctx.beginPath(); ctx.arc(x + c * d, f.y + sn * d + drop, 2.3 * (1 - u / 3), 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x + c * d * 0.78, f.y + sn * d * 0.78 + drop, 1.3, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x + c * d * 0.56, f.y + sn * d * 0.56 + drop, 0.8, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawCurtain(x0, y, w, h, flip) {
  ctx.save();
  if (flip) { ctx.translate(x0 + w, y); ctx.scale(-1, 1); } else ctx.translate(x0, y);
  ctx.fillStyle = '#c95f86';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(w, 0);
  ctx.quadraticCurveTo(w * 0.55, h * 0.45, w * 0.42, h * 0.62);
  ctx.quadraticCurveTo(w * 0.7, h * 0.85, w * 0.85, h);
  ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(120,30,70,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(w * 0.3, 4); ctx.quadraticCurveTo(w * 0.3, h * 0.4, w * 0.25, h * 0.6); ctx.lineTo(w * 0.35, h - 4);
  ctx.moveTo(w * 0.6, 4); ctx.quadraticCurveTo(w * 0.45, h * 0.4, w * 0.35, h * 0.6);
  ctx.stroke();
  ctx.fillStyle = '#f0c75e'; roundRect(ctx, w * 0.12, h * 0.58, w * 0.42, 6, 3); ctx.fill();
  ctx.restore();
}

function drawShelf(x, y, seed) {
  if (x > W + 20 || x + 150 < -20) return;
  ctx.fillStyle = '#7a4e33';
  [x + 16, x + 112].forEach(bx => { ctx.beginPath(); ctx.moveTo(bx, y + 6); ctx.lineTo(bx + 10, y + 6); ctx.lineTo(bx, y + 22); ctx.fill(); });
  let bx = x + 6;
  const n = 5 + Math.floor(hash2(seed, 1) * 4);
  for (let k = 0; k < n && bx < x + 100; k++) {
    const bw = 8 + hash2(seed, k + 10) * 7, bh = 24 + hash2(seed, k + 20) * 18;
    ctx.fillStyle = BOOK_COLORS[Math.floor(hash2(seed, k + 30) * BOOK_COLORS.length)];
    ctx.fillRect(bx, y - bh, bw, bh);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(bx, y - bh + 5, bw, 2); ctx.fillRect(bx, y - 8, bw, 2);
    bx += bw + 1;
  }
  if (hash2(seed, 50) < 0.5) {                         // potted cactus
    ctx.fillStyle = '#5bb36b'; roundRect(ctx, bx + 14, y - 30, 10, 22, 5); ctx.fill();
    roundRect(ctx, bx + 8, y - 24, 6, 10, 3); ctx.fill();
    ctx.fillStyle = '#d27a4a'; ctx.fillRect(bx + 10, y - 10, 18, 10);
  } else {                                             // rubber duck
    ctx.fillStyle = '#ffd84d';
    ctx.beginPath(); ctx.ellipse(bx + 18, y - 7, 11, 7, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 24, y - 17, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff8c3a'; ctx.beginPath(); ctx.moveTo(bx + 29, y - 18); ctx.lineTo(bx + 35, y - 16); ctx.lineTo(bx + 29, y - 14); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(bx + 26, y - 19, 1.2, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#a8714a'; ctx.fillRect(x, y, 140, 7);
  ctx.fillStyle = '#c48a5f'; ctx.fillRect(x, y, 140, 2);
}

    ctx.fillStyle = '#ffd1e0'; ctx.fillRect(x, y, w, h);
